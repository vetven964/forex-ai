<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050912">
<title>V TRADE AI — Premium Terminal V5.6</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#04070d;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="premium-dashboard-v5.5.html" title="V TRADE AI"></iframe>
<script>
const frame=document.getElementById('app');
function applyFont(){
  try{
    const d=frame.contentDocument;
    if(!d||!d.head)return;
    if(!d.getElementById('v56-font-style')){
      const style=d.createElement('style');
      style.id='v56-font-style';
      style.textContent=`@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@300;400;500;600;700;800;900&display=swap');
html,body,body *{font-family:'Noto Sans Khmer','Noto Sans',Arial,sans-serif !important;}
input::placeholder,textarea::placeholder{font-family:'Noto Sans Khmer','Noto Sans',Arial,sans-serif !important;}
button,select,input,textarea{font-family:'Noto Sans Khmer','Noto Sans',Arial,sans-serif !important;}
.brand b,.price,.big,.plan h1,.plan h3,.section-title h2{letter-spacing:0 !important;}
`;
      d.head.appendChild(style);
    }
  }catch(e){}
}
frame.addEventListener('load',applyFont);
setTimeout(applyFont,500);
</script>
</body>
</html>
