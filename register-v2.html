<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050912"><title>V TRADE AI — Register</title><style>body{margin:0;min-height:100vh;background:#04070d;color:#eef3ff;font:14px Segoe UI,Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);padding:30px;background:#09111f;border:1px solid #263756;border-radius:24px}.muted{color:#91a5c8;line-height:1.5}input,select{width:100%;box-sizing:border-box;padding:13px;margin-top:6px;border-radius:12px;border:1px solid #2b3e60;background:#111c2e;color:#fff}label{display:block;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.row{grid-template-columns:1fr}}button{width:100%;padding:14px;border:0;border-radius:12px;background:#6d2cff;color:#fff;font-weight:800;cursor:pointer}.links{display:flex;gap:12px;justify-content:center;margin-top:18px}.links a{color:#35d8ff;text-decoration:none;font-size:12px}.msg{margin-top:14px;padding:12px;border-radius:10px;display:none}.ok{background:#063b2a;border:1px solid #16d99b}.err{background:#3c1019;border:1px solid #ff526e}</style><script src="site-connection.js?v=20260821-main"></script>  <script src="vtrade-connection.js"></script>
  <script src="terminal-pre-market.js"></script>
  <script src="vtrade-rbac-guard.js"></script>
</head><body><main class="card"><h1>V TRADE AI</h1><p class="muted">Create a new member account, then use Login to enter the Main Dashboard.</p><form id="f"><div class="row"><label>Full name<input id="name" required maxlength="80"></label><label>Email<input id="email" type="email" required maxlength="160"></label></div><div class="row"><label>Password<input id="password" type="password" minlength="12" required><small class="muted">12+ chars · uppercase · lowercase · number · symbol</small></label><label>Confirm password<input id="confirm" type="password" minlength="12" required></label></div><label>Plan<select id="plan"><option value="trial">Free 7-Day Trial</option></select></label><button id="btn">🆕 Create New Member</button></form><div id="msg" class="msg"></div><div class="links"><a href="index.html">Home</a><a href="login.html">Login</a><a href="dashboard.html">Dashboard</a></div></main><script>const API=window.VTRADE?.API||'https://forexai-6xw6.onrender.com',$=id=>document.getElementById(id),msg=$('msg');(async()=>{try{const r=await fetch(API+'/api/public/pricing',{cache:'no-store'}),d=await r.json();if(r.ok&&d.plans){$('plan').innerHTML=d.plans.filter(x=>x.enabled!==false).map(x=>`<option value="${String(x.id||x.name).replace(/[^a-zA-Z0-9_-]/g,'')}">${String(x.name||x.id)} — ${Number(x.price)===0?'Free':x.price+' / '+String(x.period||'month')}</option>`).join('')}}catch(_){}})();$('f').onsubmit=async e=>{e.preventDefault();msg.style.display='none';const p=$('password').value;if(p!==$('confirm').value){msg.textContent='Passwords do not match.';msg.className='msg err';msg.style.display='block';return}if(!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{12,}$/.test(p)){msg.textContent='Password must be 12+ characters and include uppercase, lowercase, number and symbol.';msg.className='msg err';msg.style.display='block';return}$('btn').disabled=true;try{const r=await fetch(API+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({name:$('name').value.trim(),email:$('email').value.trim(),password:p,plan:$('plan').value})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||'Registration failed');msg.textContent='Account created successfully. Please Login.';msg.className='msg ok';msg.style.display='block';$('f').reset()}catch(x){msg.textContent=x.message;msg.className='msg err';msg.style.display='block'}finally{$('btn').disabled=false}};</script></body></html>
