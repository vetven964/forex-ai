<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V TRADE AI — Profile & Security</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#07090e] text-white p-4 sm:p-8">
<main class="mx-auto max-w-2xl">
  <header class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold">Profile & Security</h1>
      <p class="text-xs text-gray-400 mt-1">Server-side account security • V TRADE AI v6.3.4</p>
    </div>
    <a href="index.html" class="rounded-xl bg-gray-800 px-4 py-2 text-sm">← Terminal</a>
  </header>

  <div id="status" class="hidden rounded-xl p-3 mb-4 text-sm"></div>

  <section id="loading" class="rounded-2xl border border-gray-800 bg-gray-900 p-6 text-gray-400">
    Checking secure session…
  </section>

  <section id="profile" class="hidden space-y-5">
    <div class="rounded-2xl border border-gray-800 bg-gray-900 p-6">
      <h2 class="font-bold mb-4">Account</h2>
      <div class="grid gap-3 sm:grid-cols-2 text-sm">
        <div><span class="text-gray-500">Name</span><div id="name" class="mt-1 font-semibold">—</div></div>
        <div><span class="text-gray-500">Email</span><div id="email" class="mt-1 font-semibold break-all">—</div></div>
        <div><span class="text-gray-500">Role</span><div id="role" class="mt-1 font-semibold">—</div></div>
        <div><span class="text-gray-500">Plan</span><div id="plan" class="mt-1 font-semibold">—</div></div>
      </div>
    </div>

    <div class="rounded-2xl border border-gray-800 bg-gray-900 p-6">
      <div class="flex items-center justify-between gap-3 mb-4">
        <div><h2 class="font-bold">Security</h2><p class="text-xs text-gray-500 mt-1">Passwords are verified and stored server-side.</p></div>
        <span id="twofa" class="rounded-full bg-gray-800 px-3 py-1 text-xs">2FA: —</span>
      </div>
      <form id="passwordForm" class="space-y-4">
        <div><label class="block text-xs text-gray-400 mb-1">Current password</label><input id="currentPassword" type="password" autocomplete="current-password" required class="w-full rounded-xl bg-gray-950 border border-gray-700 px-4 py-3"></div>
        <div><label class="block text-xs text-gray-400 mb-1">New password</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="12" class="w-full rounded-xl bg-gray-950 border border-gray-700 px-4 py-3"></div>
        <div><label class="block text-xs text-gray-400 mb-1">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="12" class="w-full rounded-xl bg-gray-950 border border-gray-700 px-4 py-3"></div>
        <p class="text-[11px] text-gray-500">At least 12 characters with uppercase, lowercase, number and symbol.</p>
        <button class="w-full rounded-xl bg-blue-600 hover:bg-blue-500 py-3 font-bold">Change password</button>
      </form>
    </div>

    <button id="logout" class="w-full rounded-xl bg-red-600/20 border border-red-500/30 text-red-300 py-3 font-semibold">Sign out</button>
  </section>
</main>

<script>
const API=window.VTRADE_API_BASE_OVERRIDE||'https://forexai-6xw6.onrender.com';
let token=sessionStorage.getItem('vtrade_auth_token')||'';
function headers(extra={}){const h=new Headers(extra);if(token)h.set('x-vtrade-auth',token);return h}
async function api(path,options={}){
  const h=headers(options.headers||{});
  const r=await fetch(API+path,{...options,headers:h,credentials:'include',cache:'no-store'});
  const text=await r.text();let data={};try{data=JSON.parse(text)}catch(_){throw Error('Server returned invalid data')}
  return {r,data};
}
function show(msg,ok=false){const e=document.getElementById('status');e.textContent=msg;e.className='rounded-xl p-3 mb-4 text-sm '+(ok?'bg-emerald-500/10 text-emerald-300':'bg-red-500/10 text-red-300');e.classList.remove('hidden')}
async function load(){
  try{
    const x=await api('/api/auth/profile');
    if(!x.r.ok||!x.data.success)throw Error('Your secure session has expired. Please sign in again.');
    const u=x.data.user;
    document.getElementById('name').textContent=u.name||'—';
    document.getElementById('email').textContent=u.email||'—';
    document.getElementById('role').textContent=u.role||'—';
    document.getElementById('plan').textContent=u.plan||'—';
    document.getElementById('twofa').textContent='2FA: '+(u.twoFactorEnabled?'Enabled':'Not configured');
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('profile').classList.remove('hidden');
  }catch(e){document.getElementById('loading').classList.add('hidden');show(e.message);setTimeout(()=>location.href='index.html',1200)}
}
document.getElementById('passwordForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const currentPassword=document.getElementById('currentPassword').value;
  const newPassword=document.getElementById('newPassword').value;
  const confirmPassword=document.getElementById('confirmPassword').value;
  if(newPassword!==confirmPassword)return show('New password and confirmation do not match.');
  if(newPassword.length<12||!/[A-Z]/.test(newPassword)||!/[a-z]/.test(newPassword)||!/[0-9]/.test(newPassword)||!/[^A-Za-z0-9]/.test(newPassword))return show('New password must be at least 12 characters and include uppercase, lowercase, number and symbol.');
  try{
    const x=await api('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword,newPassword,confirmPassword})});
    if(!x.r.ok||!x.data.success)throw Error(x.data.error||'Password change failed');
    token='';sessionStorage.removeItem('vtrade_auth_token');show('Password changed successfully. Please sign in again.',true);
    setTimeout(()=>location.href='index.html',1200);
  }catch(e){show(e.message)}
});
document.getElementById('logout').addEventListener('click',async()=>{try{await api('/api/auth/logout',{method:'POST'})}catch(_){}token='';sessionStorage.removeItem('vtrade_auth_token');location.href='index.html'});
load();
</script>
</body>
</html>
