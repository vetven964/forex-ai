<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050912">
<title>V TRADE AI — Terminal Live v2</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#04070d;overflow:hidden}
#terminalFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#04070d}
#control{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9999;display:none;gap:8px;align-items:center;padding:7px;border:1px solid #1d2c44;border-radius:14px;background:#07101df5;box-shadow:0 15px 45px #000b;backdrop-filter:blur(14px)}
#control select,#control button{height:42px;border:1px solid #1d2c44;border-radius:10px;background:#09111e;color:#fff;padding:0 14px;font:800 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#control select{min-width:100px}#control button{background:#5827d2;border-color:#8050ff;min-width:145px;cursor:pointer}
#control button:disabled{opacity:.55}
@media(max-width:520px){#control{top:6px;left:8px;right:8px;transform:none;justify-content:stretch}#control select{flex:1;min-width:0}#control button{flex:1;min-width:0}}
</style>
</head>
<body>
<iframe id="terminalFrame" src="phone-terminal.html?v=20260820-v2" title="V TRADE AI Terminal Live"></iframe>
<div id="control">
<select id="tfSelect" aria-label="Timeframe">
<option value="M5">M5</option><option value="M15">M15</option><option value="H1">1H</option><option value="H4">4H</option><option value="D1">1D</option>
</select>
<button id="analyzeBtn" type="button">✦ Analyze AI</button>
</div>
<script>
(function(){
'use strict';
const frame=document.getElementById('terminalFrame');
const control=document.getElementById('control');
const select=document.getElementById('tfSelect');
const analyze=document.getElementById('analyzeBtn');
let doc=null;
function getButtons(){return [...doc.querySelectorAll('#timeframes [data-tf]')];}
function setTf(tf,run){
 if(!doc)return;
 const btn=doc.querySelector('#timeframes [data-tf="'+tf+'"]');
 if(!btn)return;
 getButtons().forEach(x=>x.classList.remove('active'));
 btn.classList.add('active');
 select.value=tf;
 if(run)btn.click();
}
function patch(){
 doc=frame.contentDocument;
 if(!doc)return;
 const toolbar=doc.getElementById('timeframes');
 if(!toolbar)return setTimeout(patch,150);
 const oldButtons=getButtons();
 const oldAnalyze=doc.getElementById('analyze');
 toolbar.style.display='none';
 control.style.display='flex';
 const active=oldButtons.find(x=>x.classList.contains('active'))?.dataset.tf||'M5';
 select.value=active;
 analyze.onclick=function(){
   if(!doc)return;
   const tf=select.value;
   setTf(tf,true);
   if(oldAnalyze){
     oldAnalyze.click();
   }
 };
 select.onchange=function(){setTf(select.value,true)};
}
frame.addEventListener('load',function(){setTimeout(patch,100)});
})();
</script>
</body>
</html>
