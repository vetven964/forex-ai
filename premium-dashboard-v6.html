<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V TRADE AI — Dashboard V6</title><style>html,body{margin:0;width:100%;height:100%;background:#04070d;overflow:hidden}#langbar{position:fixed;right:16px;bottom:16px;z-index:99999;display:flex;align-items:center;gap:6px;background:rgba(9,17,30,.96);border:1px solid #263650;border-radius:10px;padding:5px 7px;box-shadow:0 10px 30px #0009;backdrop-filter:blur(12px)}#langbar label{font:10px Segoe UI,Arial,sans-serif;color:#8190a8}#lang{height:30px;background:#0b1423;color:#fff;border:1px solid #394b68;border-radius:7px;padding:0 7px;font:11px Segoe UI,Arial,sans-serif;outline:none}iframe{border:0;width:100%;height:100%;display:block}@media(max-width:760px){#langbar{right:10px;bottom:max(10px,env(safe-area-inset-bottom));padding:4px 6px;border-radius:9px}#langbar label{display:none}#lang{height:28px;font-size:10px}}</style></head><body><div id="langbar"><label>🌐 Language</label><select id="lang"><option value="km">🇰🇭 ខ្មែរ</option><option value="en">🇺🇸 English</option><option value="zh">🇨🇳 中文</option><option value="th">🇹🇭 ไทย</option><option value="vi">🇻🇳 Tiếng Việt</option><option value="ja">🇯🇵 日本語</option></select></div><iframe id="dash" src="premium-dashboard-v5.html" title="V TRADE AI"></iframe><script>const iframe=document.getElementById('dash'),lang=document.getElementById('lang');const saved=localStorage.getItem('vtrade-language')||'km';lang.value=saved;function fix(){try{const d=iframe.contentDocument;if(!d)return;const old=d.getElementById('bar');if(old)old.style.display='none';if(!d.getElementById('v6-font')){const s=d.createElement('style');s.id='v6-font';s.textContent=`html,body{font-family:"Noto Sans Khmer","Noto Sans Thai","Noto Sans Vietnamese","Noto Sans JP","Segoe UI",Arial,sans-serif!important}body{overflow:auto!important}button,select,input,textarea{font-family:inherit!important}.sub,.label,.kv,.level,.struct,.tfitem,.newsitem,.table,.ticker{line-height:1.45!important}@media(max-width:760px){.top{padding-top:14px!important;padding-bottom:14px!important}.wrap{padding-bottom:60px!important}.card{padding:15px!important}.big{font-size:24px!important}.chart{height:300px!important}}`;d.head.appendChild(s);const l=d.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700;800;900&family=Noto+Sans+Thai:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap';d.head.appendChild(l)}const inner=d.getElementById('lang');if(inner&&inner.value!==lang.value){inner.value=lang.value;inner.dispatchEvent(new Event('change',{bubbles:true}))}}catch(e){}}iframe.addEventListener('load',()=>{fix();setTimeout(fix,500);setTimeout(fix,1500)});lang.addEventListener('change',()=>{localStorage.setItem('vtrade-language',lang.value);fix();setTimeout(fix,100)});setInterval(fix,3000);</script></body></html>
