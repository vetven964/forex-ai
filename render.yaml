services:
  - type: web
    name: v-trade-ai-terminal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: BANK_NAME
        sync: false
      - key: BANK_ACCOUNT_KHR
        sync: false
      - key: BANK_ACCOUNT_USD
        sync: false
