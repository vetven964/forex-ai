services:
  - type: web
    name: v-trade-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: PORT
        value: "10000"
      - key: APP_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://vetven964.github.io
      - key: MT5_BRIDGE_API_KEY
        generateValue: true
      - key: MT5_SYMBOL
        value: XAUUSD
      - key: MT5_MAX_AGE_MS
        value: "15000"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: STORAGE_RETENTION_DAYS
        value: "30"
      - key: STORAGE_QUOTE_INTERVAL_MS
        value: "10000"
      - key: NEWS_CALENDAR_URLS
        value: https://nfs.faireconomy.media/ff_calendar_thisweek.json,https://cdn-nfs.faireconomy.media/ff_calendar_thisweek.json
      - key: NEWS_CACHE_MS
        value: "90000"
      - key: NEWS_BRIDGE_MAX_AGE_MS
        value: "600000"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
