function renderTelegram(){simple('telegram',`<div class="big cyan">READY</div><div class="notice">Telegram connection UI is ready for the backend bot. This page does not expose bot tokens.</div><button class="action" onclick="alert('Telegram test is backend-gated.')">${t('test')}</button>`)}
function renderRisk(){simple('risk',`<div class="formgrid"><div class="field"><label>${t('balance')}</label><input id="bal" type="number" value="10000"></div><div class="field"><label>${t('riskpct')}</label><input id="rp" type="number" value="1"></div><div class="field"><label>${t('entryprice')}</label><input id="re" type="number" value="${money(data?.livePrice)}"></div><div class="field"><label>${t('stopprice')}</label><input id="rs" type="number" value="${money(data?.stopLoss)}"></div></div><button class="action" style="margin-top:12px" onclick="calcRisk()">${t('calculate')}</button><div id="riskOut" class="notice">—</div>`)}function calcRisk(){const b=+bal.value,r=+rp.value,e=+re.value,s=+rs.value;const risk=b*r/100;const dist=Math.abs(e-s);riskOut.textContent=dist>0?`Risk $${risk.toFixed(2)} · Distance ${dist.toFixed(2)} · Demo lot estimate ${(risk/dist/100).toFixed(2)} lots`:'Enter valid prices'}
function renderBacktest(){simple('backtest',`<div class="notice">Backtest UI is prepared. Connect a historical-data endpoint before showing performance statistics.</div><div class="grid cards" style="margin-top:12px">${card('<div class="label">Win Rate</div><div class="big">—</div>')}${card('<div class="label">Profit Factor</div><div class="big">—</div>')}${card('<div class="label">Max Drawdown</div><div class="big red">—</div>')}</div>`)}function renderHistory(){simple('history',`<div class="tablewrap"><table class="table"><thead><tr><th>Time</th><th>Signal</th><th>Entry</th><th>SL</th><th>TP</th><th>Status</th></tr></thead><tbody><tr><td colspan="6">No confirmed live trades stored yet.</td></tr></tbody></table></div>`)}function renderSettings(){simple('settings',`<div class="formgrid"><div class="field"><label>${t('language')}</label><select onchange="lang=this.value;localStorage.setItem('vtrade_lang',lang);renderAll()"><option value="en" ${lang==='en'?'selected':''}>${t('english')}</option><option value="km" ${lang==='km'?'selected':''}>${t('khmer')}</option></select></div><div class="field"><label>Auto Refresh</label><select><option>6 seconds</option><option>10 seconds</option></select></div></div><button class="action" style="margin-top:12px" onclick="alert('Settings saved locally.')">${t('save')}</button>`)}function renderPricing(){simple('pricing',`<div class="grid cards">${card('<h3>Free</h3><div class="sub">Dashboard + demo analysis</div><div class="big">$0</div>')}${card('<h3>Pro</h3><div class="sub">Advanced AI + alerts</div><div class="big cyan">$19</div>')} ${card('<h3>Premium</h3><div class="sub">Full terminal features</div><div class="big purple">$39</div>')}</div>`)}function renderSupport(){simple('support',`<div class="notice">Support Center · Check deployment logs, API health and Telegram/MT5 connection status here.</div><button class="action" onclick="alert('Support request UI ready.')">Contact Support</button>`)}
async function load(){try{const r=await fetch(API+'/api/analysis/xauusd',{cache:'no-store'});data=await r.json();document.getElementById('price').textContent=money(data.livePrice);document.getElementById('status').textContent=data.brokerConnected?'● MT5 LIVE':'● OFFLINE';document.getElementById('status').className='live '+(data.brokerConnected?'':'red');renderPage(location.hash.slice(1)||'dashboard')}catch(e){document.getElementById('status').textContent='● OFFLINE';renderPage(location.hash.slice(1)||'dashboard')}}
function renderAll(){renderNav();document.getElementById('tfbar').innerHTML=tfHTML();renderPage(location.hash.slice(1)||'dashboard')}
window.addEventListener('hashchange',()=>go(location.hash.slice(1)||'dashboard'));renderAll();load();setInterval(load,6000);
</script></body></html>
