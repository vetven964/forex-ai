<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V TRADE AI — Register</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#2b1458 0,transparent 32%),radial-gradient(circle at 85% 15%,#06404a 0,transparent 28%),#04070d;color:#eef3ff;font:14px 'Kantumruy Pro','Noto Sans Khmer','Segoe UI',Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#09111f;border:1px solid #263756;border-radius:24px;padding:32px;box-shadow:0 20px 70px #0008}.brand{display:flex;gap:14px;align-items:center;margin-bottom:20px}.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#6d2cff,#9a55ff);display:grid;place-items:center;font-size:30px;font-weight:900}.muted,.hint{color:#91a5c8;line-height:1.5}.grid{display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.row{grid-template-columns:1fr}}label{display:grid;gap:7px;font-weight:600}input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #2b3e60;background:#111c2e;color:#fff;outline:none}button{border:0;border-radius:12px;padding:14px;background:#6d2cff;color:#fff;font-weight:800;cursor:pointer;font-size:15px}button:disabled{opacity:.6}.plan,.note{padding:13px;border:1px solid #2b3e60;border-radius:12px;background:#0d1727}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#102f27;color:#48e4b0;font-size:12px;font-weight:800}.ok,.err{display:none;margin-top:14px;padding:13px;border-radius:12px}.ok{background:#063b2a;border:1px solid #16d99b;color:#8ff5cf}.err{background:#3c1019;border:1px solid #ff526e;color:#ffb2bf}.back{display:inline-block;margin-top:14px;color:#35d8ff;text-decoration:none;font-size:12px}.hint{font-size:11px}.next{display:none;margin-top:12px;padding:12px;border:1px solid #285d4c;border-radius:12px;background:#07251d;
