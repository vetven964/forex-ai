<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V TRADE AI — Create New Member</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#2b1458 0,transparent 32%),radial-gradient(circle at 85% 15%,#06404a 0,transparent 28%),#04070d;color:#eef3ff;font:14px Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#09111f;border:1px solid #263756;border-radius:24px;padding:32px;box-shadow:0 20px 70px #0008}.brand{display:flex;gap:14px;align-items:center;margin-bottom:24px}.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#6d2cff,#9a55ff);display:grid;place-items:center;font-size:30px;font-weight:900}.muted{color:#91a5c8;line-height:1.5}.grid{display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.row{grid-template-columns:1fr}}label{display:grid;gap:7px;font-weight:600}input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #2b3e60;background:#111c2e;color:#fff;outline:none}input:focus,select:focus{border-color:#7b43ff}button{border:0;border-radius:12px;padding:14px;background:#6d2cff;color:#fff;font-weight:800;cursor:pointer;font-size:15px}button:disabled{opacity:.6}.plan{padding:13px;border:1px solid #2b3e60;border-radius:12px;background:#0d1727}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#102f27;color:#48e4b0;font-size:12px;font-weight:800}.ok,.err{display:none;margin-top:14px;padding:13px;border-radius:12px}.ok{background:#063b2a;border:1px solid #16d99b;color:#8ff5cf}.err{background:#3c1019;border:1px solid #ff526e;color:#ffb2bf}.back{display:inline-block;margin-top:14px;color:#35d8ff;text-decoration:none;font-size:12px}.hint{font-size:11px;color:#91a5c8;font-weight:400}
</style></head>
<body><main class="card">
<div class="brand"><div class="logo">V</div><div><h1 style="margin:0">V TRADE AI</h1><div class="muted">Create a new member account</div></div></div>
<div class="plan"><span class="badge">🆕 NEW MEMBER</span><div style="margin-top:8px">Your account is stored server-side. Paid plans are selected here but should only be granted according to the configured billing/payment flow.</div></div>
<form id="form" class="grid" style="margin-top:20px" autocomplete="on">
<div class="row"><label>Full name<input id="name" required maxlength="80" autocomplete="name"></label><label>Email<input id="email" type="email" required maxlength="160" autocomplete="email"></label></div>
<div class="row"><label>Password<input id="password" type="password" required minlength="12" autocomplete="new-password"><span class="hint">12+ chars · uppercase · lowercase · number · symbol</span></label><label>Confirm password<input id="confirm" type="password" required minlength="12" autocomplete="new-password"></label></div>
<label>Plan<select id="plan"><option value="trial">Loading plans…</option></select></label>
<button id="submit">🆕 Create New Member</button>
</form><div id="ok" class="ok"></div><div id="err" class="err"></div>
<a class="back" href="login.html">← Back to Sign in</a>
</main>
<script>
const API='https://forexai-6xw6.onrender.com';
const f=document.getElementById('form'),btn=document.getElementById('submit'),ok=document.getElementById('ok'),err=document.getElementById('err'),planEl=document.getElementById('plan');
const show=(el,text)=>{el.textContent=text;el.style.display='block'};
(async()=>{try{const r=await fetch(API+'/api/public/pricing',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error();const plans=(d.plans||[]).filter(x=>x.enabled!==false);planEl.innerHTML=plans.map(x=>`<option value="${String(x.id).replace(/[^a-zA-Z0-9_-]/g,'')}">${x.name} — ${Number(x.price)===0?'Free':x.price+' / '+x.period}</option>`).join('')||'<option value="trial">Free 7-Day Trial</option>';}catch(_){planEl.innerHTML='<option value="trial">Free 7-Day Trial</option>';}})();
f.addEventListener('submit',async e=>{e.preventDefault();ok.style.display='none';err.style.display='none';const p=password.value.trim();if(p!==confirm.value){show(err,'Passwords do not match.');return}if(!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{12,}$/.test(p)){show(err,'Password must be 12+ characters and include uppercase, lowercase, number and symbol.');return}btn.disabled=true;btn.textContent='Creating…';try{const r=await fetch(API+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({name:name.value.trim(),email:email.value.trim(),password:p,plan:planEl.value})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||'Registration failed');if(d.token){sessionStorage.setItem('vtrade_auth_token',d.token);sessionStorage.setItem('vtrade_auth',d.token);sessionStorage.setItem('vtrade_user',JSON.stringify(d.user||{}));}show(ok,'🆕 Account created successfully. Opening V TRADE AI…');setTimeout(()=>location.href='premium-dashboard-v5.html',500)}catch(x){show(err,x.message)}finally{btn.disabled=false;btn.textContent='🆕 Create New Member'}});
</script></body></html>
