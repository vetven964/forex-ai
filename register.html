<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V TRADE AI — Register</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050a13;color:#eef3ff;font:15px Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#09111f;border:1px solid #263756;border-radius:24px;padding:32px;box-shadow:0 20px 70px #0008}.brand{display:flex;gap:14px;align-items:center;margin-bottom:24px}.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#6d2cff,#9a55ff);display:grid;place-items:center;font-size:30px;font-weight:900}.muted{color:#91a5c8}.grid{display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.row{grid-template-columns:1fr}}label{display:grid;gap:7px;font-weight:600}input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #2b3e60;background:#111c2e;color:#fff;outline:none}input:focus,select:focus{border-color:#7b43ff}button{border:0;border-radius:12px;padding:14px;background:#6d2cff;color:#fff;font-weight:800;cursor:pointer;font-size:15px}button:disabled{opacity:.6}.plan{padding:13px;border:1px solid #2b3e60;border-radius:12px;background:#0d1727}.ok{display:none;margin-top:14px;padding:13px;border-radius:12px;background:#063b2a;border:1px solid #16d99b;color:#8ff5cf}.err{display:none;margin-top:14px;padding:13px;border-radius:12px;background:#3c1019;border:1px solid #ff526e;color:#ffb2bf}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#102f27;color:#48e4b0;font-size:12px;font-weight:800}
</style></head>
<body><main class="card">
<div class="brand"><div class="logo">V</div><div><h1 style="margin:0">V TRADE AI</h1><div class="muted">Create a new member account</div></div></div>
<div class="plan"><span class="badge">NEW MEMBER</span><div style="margin-top:8px">Register once, then choose the access plan. Account creation is recorded by the server.</div></div>
<form id="form" class="grid" style="margin-top:20px">
<div class="row"><label>Full name<input id="name" required maxlength="80" autocomplete="name"></label><label>Email<input id="email" type="email" required maxlength="160" autocomplete="email"></label></div>
<div class="row"><label>Password<input id="password" type="password" required minlength="8" autocomplete="new-password"></label><label>Confirm password<input id="confirm" type="password" required minlength="8" autocomplete="new-password"></label></div>
<label>Plan<select id="plan"><option value="FREE">Free</option><option value="PRO">Pro</option><option value="PREMIUM">Premium</option></select></label>
<button id="submit">🆕 Create new member</button>
</form><div id="ok" class="ok"></div><div id="err" class="err"></div>
<p class="muted" style="margin-bottom:0">Already registered? Return to the V TRADE AI sign-in page.</p>
</main>
<script>
const f=document.getElementById('form'),btn=document.getElementById('submit'),ok=document.getElementById('ok'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{e.preventDefault();ok.style.display='none';err.style.display='none';const p=password.value;if(p!==confirm.value){err.textContent='Passwords do not match.';err.style.display='block';return}btn.disabled=true;try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value.trim(),email:email.value.trim(),password:p,plan:plan.value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Registration failed');ok.textContent='🆕 New member created successfully. User: '+d.user.name+' · Plan: '+d.user.plan;ok.style.display='block';f.reset()}catch(x){err.textContent=x.message;err.style.display='block'}finally{btn.disabled=false}});
</script></body></html>
