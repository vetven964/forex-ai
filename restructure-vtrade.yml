# V TRADE canonical structure migration — trigger commit
name: V TRADE Structure Migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild clean server/ui structure
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f server/server.js && -f ui/dashboard.html ]]; then echo "[V-TRADE STRUCTURE] already migrated"; exit 0; fi
          if [[ -f vtrade-responsive.css && -f dashboard.html ]]; then echo "[V-TRADE STRUCTURE] responsive root UI architecture active; no destructive migration"; exit 0; fi
          mkdir -p server ui
          ui_js=(auth-register.js frontend-admin-hotfix.js mobile-first-workflow-v1.js mtf-dashboard-adapter.js pre-market-authority-ui-hotfix.js pre-market-intelligence-ui.js pre-market-post-open-ai.js pwa.js site-connection.js sw.js telegram-auto-scan-guard.js telegram-auto-watchdog.js terminal-pre-market.js terminal-watchdog.js vtrade-admin-menu-all-session.js vtrade-ai-button-hotfix.js vtrade-connection.js vtrade-logic-ui-hotfix.js vtrade-rbac-guard.js)
          for f in "${ui_js[@]}"; do [[ -f "$f" ]] && git mv "$f" "ui/$f"; done
          for f in *.html; do [[ -e "$f" ]] || continue; case "$f" in dashboard.html|account-terminal.html|ai-desk.html|admin-dashboard.html|phone-admin.html|phone-center.html|register-v2.html|connection.html) git rm -f "$f" ;; premium-dashboard-live.html) git mv "$f" "ui/dashboard.html" ;; *) git mv "$f" "ui/$f" ;; esac; done
          [[ -f frontend/login.html ]] && git rm -f frontend/login.html || true
          rmdir frontend 2>/dev/null || true
          for f in *.css *.webmanifest; do [[ -e "$f" ]] && git mv "$f" "ui/$f"; done
          [[ -d icons ]] && git mv icons ui/icons
          [[ -d backend ]] && git mv backend server/backend
          [[ -d core ]] && git mv core server/core
          [[ -d MT5 ]] && git mv MT5 server/MT5
          for f in *.js; do [[ -e "$f" ]] && git mv "$f" "server/$f"; done
          find .github/workflows -maxdepth 1 -type f -name '*.yml' ! -name 'restructure-vtrade.yml' -delete
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/vtrade-enhanced-launcher.js'); s=p.read_text(); s=s.replace("path.join(ROOT,'premium-dashboard-live.html')","path.join(ROOT,'../ui/dashboard.html')").replace("path.join(ROOT,'pre-market-intelligence-ui.js')","path.join(ROOT,'../ui/pre-market-intelligence-ui.js')").replace("path.join(ROOT,'pre-market-post-open-ai.js')","path.join(ROOT,'../ui/pre-market-post-open-ai.js')").replace("path.join(ROOT,'pre-market-authority-ui-hotfix.js')","path.join(ROOT,'../ui/pre-market-authority-ui-hotfix.js')"); marker="// Package/RBAC gate: demo users see the dashboard shell; purchased plans unlock features.\ntry { require('./package-access-hotfix.js'); console.log('[V-TRADE START] Package/RBAC access gate loaded'); } catch (e) { console.error('[V-TRADE PACKAGE] FATAL:', e.stack || e.message); throw e; }\n\n"; s=s if 'package-access-hotfix.js' in s else s.replace('// Pre-Market route boot hotfix MUST run before server.js is required.',marker+'// Pre-Market route boot hotfix MUST run before server.js is required.'); p.write_text(s)
          p=Path('server/package-access-hotfix.js'); s=p.read_text().replace("path.resolve(__dirname,'premium-dashboard-live.html')","path.resolve(__dirname,'../ui/dashboard.html')"); p.write_text(s)
          p=Path('server/predeploy-consistency-hotfix.js'); s=p.read_text().replace("path.join(ROOT, 'terminal-pre-market.js')","path.join(ROOT, '../ui/terminal-pre-market.js')").replace("path.join(ROOT, 'vtrade-ai-button-hotfix.js')","path.join(ROOT, '../ui/vtrade-ai-button-hotfix.js')"); p.write_text(s)
          p=Path('server/server.js'); s=p.read_text(); anchor='const app = express();'; boot="""const app = express();
          const UI_ROOT = path.resolve(__dirname, '../ui');
          app.use(express.static(UI_ROOT, { index: 'index.html', fallthrough: true, maxAge: '1h' }));
          app.get('/', (_req,res)=>res.sendFile(path.join(UI_ROOT,'index.html')));
          """; s=s if "const UI_ROOT = path.resolve(__dirname, '../ui')" in s else s.replace(anchor,boot,1); p.write_text(s)
          p=Path('package.json'); s=p.read_text().replace('"start": "node vtrade-enhanced-launcher.js"','"start": "node server/vtrade-enhanced-launcher.js"').replace('"main": "server.js"','"main": "server/server.js"'); p.write_text(s)
          p=Path('render.yaml'); s=p.read_text().replace('startCommand: node server-launcher.js','startCommand: node server/vtrade-enhanced-launcher.js'); p.write_text(s)
          p=Path('ui/index.html'); p.write_text('''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050912"><title>V TRADE AI — Main Portal</title><style>:root{--bg:#04070d;--line:#233552;--text:#f5f8ff;--muted:#8d9bb0;--purple:#8050ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#281450,transparent 32%),radial-gradient(circle at 90% 5%,#073c43,transparent 30%),var(--bg);color:var(--text);font:14px Segoe UI,Arial,sans-serif}.shell{width:min(1100px,92%);margin:auto}.top{min-height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;margin-right:auto}.logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;font-weight:950;background:linear-gradient(135deg,#5120ff,#aa72ff)}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{color:#b8c5d8;text-decoration:none;border:1px solid var(--line);background:#09111e;padding:10px 13px;border-radius:10px;font-weight:800}.nav .primary{background:linear-gradient(135deg,#5421cf,#7136e8);border-color:var(--purple);color:#fff}.hero{text-align:center;padding:90px 10px 45px}.badge{display:inline-block;padding:7px 11px;border:1px solid #31566c;border-radius:99px;background:#0a1824;color:#9deee3;font-size:10px;font-weight:900}.hero h1{font-size:clamp(38px,7vw,68px);margin:18px 0 10px}.hero p{max-width:760px;margin:auto;color:var(--muted);line-height:1.8}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#0b1423f5,#070c15f5)}.card p{color:var(--muted);line-height:1.6}.actions{display:flex;justify-content:center;gap:10px;margin:28px 0}.btn{display:inline-block;text-decoration:none;color:#fff;border:1px solid var(--line);background:#09111e;padding:13px 20px;border-radius:12px;font-weight:900}.primary{background:linear-gradient(135deg,#5421cf,#7136e8);border-color:var(--purple)}footer{text-align:center;color:#64738a;font-size:10px;padding:35px 0}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column;padding:14px 0}.nav{width:100%}.nav a{flex:1;text-align:center}.hero{padding:55px 5px 30px}.cards{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr}.btn{text-align:center}}</style></head><body><div class="shell"><header class="top"><a class="brand" href="/"><span class="logo">V</span><span><b>V TRADE AI</b><small style="display:block;color:#8d9bb0;font-size:10px">ICT Smart Trading Terminal</small></span></a><nav class="nav"><a href="https://github.com/vetven964/forexai" target="_blank" rel="noopener noreferrer">GitHub</a><a href="/login.html">Login</a><a href="/register.html">Register</a><a class="primary" href="/dashboard.html">Dashboard</a></nav></header><main><section class="hero"><span class="badge">XAUUSD · ICT · MTF · AI</span><h1>V TRADE AI</h1><p>Register and use the Demo Dashboard. Live Terminal, Signals, AI, News, Telegram, Risk and History unlock only after a purchased package is confirmed.</p><div class="actions"><a class="btn primary" href="/dashboard.html">Open Dashboard</a><a class="btn" href="/login.html">Login</a><a class="btn" href="/register.html">Register</a></div></section><section class="cards"><article class="card"><h3>Main Dashboard</h3><p>One dashboard contains Terminal, Signals, AI Intelligence, News, Telegram, Risk, History and Settings.</p></article><article class="card"><h3>Demo Access</h3><p>New accounts can enter the dashboard shell, but paid features remain locked.</p></article><article class="card"><h3>Paid Access</h3><p>Server-side package access enables only the features included in the purchased plan.</p></article></section></main><footer>V TRADE AI · GitHub · Login · Register · Dashboard</footer></div></body></html>\n''')
          for name in ('ui/login.html','ui/register.html'):
            p=Path(name)
            if not p.exists(): continue
            s=p.read_text().replace('<script src="terminal-pre-market.js"></script>','').replace('<script src="vtrade-rbac-guard.js"></script>','').replace('dashboard.html','/dashboard.html').replace("location.replace('connection.html?required=login&flow=auth')","location.replace('/dashboard.html')").replace('location.replace("connection.html?required=login&flow=auth")',"location.replace('/dashboard.html')")
            p.write_text(s)
          for f in tmp.txt tmp2.txt tmp3.txt tmp4.txt tmp5.txt tmp6.txt tmp7.txt tmp8.txt; do [[ -f "$f" ]] && git rm -f "$f"; done
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add -A; git commit -m 'refactor: clean V TRADE server ui architecture' || exit 0; git push
