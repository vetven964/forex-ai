name: V TRADE AI — Single Connection

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attach shared browser modules to HTML pages
        shell: python
        run: |
          from pathlib import Path

          changed = []
          markers = [
              '<script src="vtrade-connection.js"></script>',
              '<script src="terminal-pre-market.js"></script>',
              '<script src="vtrade-rbac-guard.js"></script>'
          ]

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text
              lower = text.lower()
              head = lower.rfind('</head>')
              if head < 0:
                  continue

              for marker in markers:
                  if marker not in text:
                      text = text[:head] + '  ' + marker + '\n' + text[head:]
                      head += len(marker) + 3

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Wired:', ', '.join(changed) if changed else 'none')

      - name: Commit connection wiring
        shell: bash
        run: |
          git config user.name "V TRADE AI Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' vtrade-connection.js terminal-pre-market.js vtrade-rbac-guard.js
          if git diff --cached --quiet; then
            echo "No wiring changes to commit."
            exit 0
          fi
          git commit -m "feat: wire connection, pre-market and RBAC guards"
          git push
