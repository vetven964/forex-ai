name: PC Terminal Logic Fix

on:
  push:
    branches: [main]
    paths:
      - 'pc-premium-terminal.html'
      - 'premium-dashboard-live.html'
      - '.github/workflows/pc-terminal-logic-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch live MTF strength UI
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('premium-dashboard-live.html')
          s = p.read_text(encoding='utf-8')

          marker = '<!-- VTRADE-MTF-STRENGTH-UI-V1 -->'
          if marker in s:
              raise SystemExit(0)

          # Five real MTF cards: M5, M15, H1, H4, D1.
          # Strength is directional: BUY% for bullish, SELL% for bearish.
          # Neutral uses the stronger side without inventing a direction.
          start = s.find('function renderRadar(a){')
          end = s.find('function renderGates(a)', start)
          if start < 0 or end < 0:
              raise SystemExit('renderRadar target not found')

          new_fn = r'''function renderRadar(a){
  const tfs=['M5','M15','H1','H4','D1'];
  const rows=a.timeframes||a.mtf?.timeframes||{};
  const get=(tf)=>rows[tf]||rows[tf.toLowerCase()]||{};
  const num=v=>Number.isFinite(Number(v))?Math.max(0,Math.min(100,Number(v))):null;
  const label=v=>v==null?'—':Math.round(v);
  const color=b=>cls(b)==='bull'?'green':cls(b)==='bear'?'red':'gold';

  $('radar').classList.add('mtf5');
  $('radar').innerHTML=tfs.map(tf=>{
    const t=get(tf);
    const bp=num(t.buyPct??t.buyStrengthPct??t.buyScore??t.buyerPower);
    const sp=num(t.sellPct??t.sellStrengthPct??t.sellScore??t.sellerPower);
    const b=badge(t.bias||t.direction||'NEUTRAL');
    const strength=b==='BULLISH'?(bp??50):b==='BEARISH'?(sp??50):Math.max(bp??50,sp??50);
    const open=num(t.openMove!=null?50:50);
    const reason=t.reason||t.structure?.state||t.state||'Live MT5 timeframe';
    return `<div class="card tf ${cls(b)} mtf-strength-card">
      <div class="tf-head"><b>${tf}</b><span class="pill ${cls(b)}">${b}</span></div>
      <div class="mtf-strength-value ${color(b)}">${label(strength)}%</div>
      <div class="sub">Directional strength</div>
      <div class="bar"><i style="width:${label(strength)==='—'?0:label(strength)}%"></i></div>
      <div class="kv"><span>BUY</span><b class="green">${label(bp)}%</b></div>
      <div class="kv"><span>SELL</span><b class="red">${label(sp)}%</b></div>
      <div class="sub mtf-reason">${reason}</div>
    </div>`;
  }).join('');

  const core=['H4','H1','M15'];
  const coreRows=core.map(get);
  const bull=coreRows.filter(x=>badge(x.bias||x.direction)==='BULLISH').length;
  const bear=coreRows.filter(x=>badge(x.bias||x.direction)==='BEARISH').length;
  const count=Math.max(bull,bear);
  const side=bull>=bear?'BULLISH':'BEARISH';
  $('alignment').textContent=`${count}/3`;
  $('alignment').className='huge '+(count>=2?(side==='BULLISH'?'green':'red'):'cyan');
  $('alignbar').style.width=`${Math.min(100,count/3*100)}%`;
  $('alignText').textContent=`${count}/3 ${count>=2?side:'WAIT'}`;
}
'''
          s = s[:start] + new_fn + s[end:]

          # Add responsive styling for five cards.
          css_marker = '/* VTRADE-MTF-STRENGTH-CSS-V1 */'
          css = r'''/* VTRADE-MTF-STRENGTH-CSS-V1 */
.radar.mtf5{grid-template-columns:repeat(5,minmax(0,1fr))}
.mtf-strength-card{min-height:205px}
.mtf-strength-value{font-size:32px;font-weight:950;margin:10px 0 4px}
.mtf-reason{margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1250px){.radar.mtf5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.radar.mtf5{grid-template-columns:1fr}}
'''
          style_end = s.find('</style>')
          if style_end < 0:
              raise SystemExit('style marker not found')
          s = s[:style_end] + css + s[style_end:]

          # Put the marker in the HTML so this patch is idempotent.
          s = s.replace('<section class="section" id="terminal">', marker+'\n<section class="section" id="terminal">', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit live UI patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add premium-dashboard-live.html
          git diff --cached --quiet || git commit -m 'fix: show M5 M15 H1 H4 D1 strength cards'
          git push
