name: V TRADE AI Mobile Header Fix

on:
  push:
    branches: [main]
    paths:
      - 'MOBILE_HEADER_FIX_TRIGGER'
      - '.github/workflows/mobile-header-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply responsive single-row header patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('vtrade-connection.js')
          text = p.read_text(encoding='utf-8')
          marker = '/* V TRADE AI MOBILE SINGLE-ROW HEADER PATCH v1 */'
          if marker not in text:
              anchor = "document.head.appendChild(style);"
              start = text.index('function installResponsiveLayer()')
              pos = text.index(anchor, start)
              css = r'''\n      /* V TRADE AI MOBILE SINGLE-ROW HEADER PATCH v1 */
      .top.vtrade-single-row{display:flex!important;flex-wrap:nowrap!important;align-items:center!important;gap:8px!important;overflow-x:auto!important;overflow-y:hidden!important;scrollbar-width:none!important;white-space:nowrap!important}
      .top.vtrade-single-row::-webkit-scrollbar{display:none}
      .top.vtrade-single-row .mobile{display:grid!important;flex:0 0 40px!important;width:40px!important;min-width:40px!important;height:40px!important;min-height:40px!important;grid-row:auto!important}
      .top.vtrade-single-row .pair{flex:0 0 auto!important;min-width:max-content!important;max-width:none!important}
      .top.vtrade-single-row .pair>div{min-width:max-content!important}
      .top.vtrade-single-row .pair b,.top.vtrade-single-row .pair .sub{white-space:nowrap!important;overflow:visible!important;text-overflow:clip!important}
      .top.vtrade-single-row .price{flex:0 0 auto!important}
      .top.vtrade-single-row .tfs{display:flex!important;flex:0 0 auto!important;margin-left:0!important;width:auto!important;min-width:max-content!important;overflow:visible!important;padding:0!important}
      .top.vtrade-single-row .tfs button,.top.vtrade-single-row .lang-btn{flex:0 0 auto!important}
      @media(max-width:900px){
        .top.vtrade-single-row{padding:calc(8px + var(--safe-top)) 10px 8px!important;min-height:58px!important}
        .top.vtrade-single-row .mobile{width:38px!important;min-width:38px!important;height:38px!important;min-height:38px!important}
        .top.vtrade-single-row .pair{gap:5px!important}
        .top.vtrade-single-row .star{font-size:16px!important}
        .top.vtrade-single-row .pair b{font-size:13px!important}
        .top.vtrade-single-row .pair .sub{display:inline!important;font-size:8px!important;margin-left:4px!important;color:#8493ab!important}
        .top.vtrade-single-row .price{font-size:20px!important;line-height:1!important}
        .top.vtrade-single-row .live{font-size:9px!important}
        .top.vtrade-single-row .backend{font-size:8px!important;padding:5px 7px!important}
        .top.vtrade-single-row .tfs{gap:4px!important}
        .top.vtrade-single-row .tfs button,.top.vtrade-single-row .lang-btn{min-width:42px!important;width:42px!important;min-height:38px!important;height:38px!important;padding:7px 8px!important;font-size:12px!important}
        .top.vtrade-single-row .lang-row{display:flex!important;flex:0 0 auto!important;width:auto!important;margin:0!important;gap:4px!important}
        .top.vtrade-single-row .vtrade-account{display:none!important}
      }
      @media(max-width:380px){
        .top.vtrade-single-row .pair .sub{display:none!important}
        .top.vtrade-single-row .price{font-size:19px!important}
        .top.vtrade-single-row .live{font-size:8px!important}
        .top.vtrade-single-row .backend{display:none!important}
        .top.vtrade-single-row .tfs button,.top.vtrade-single-row .lang-btn{min-width:40px!important;width:40px!important}
      }
'''
              replacement = "style.textContent += `" + css.replace('`','\\`') + "`;\n    " + anchor
              text = text[:pos] + replacement + text[pos+len(anchor):]
              p.write_text(text, encoding='utf-8')

      - name: Mark header as single-row at runtime
        shell: python
        run: |
          from pathlib import Path
          p = Path('vtrade-connection.js')
          text = p.read_text(encoding='utf-8')
          marker = '/* V TRADE AI MOBILE SINGLE-ROW RUNTIME v1 */'
          if marker not in text:
              target = "function installResponsiveLayer(){"
              start = text.index(target)
              insert_at = text.index("if(document.getElementById('vtradeResponsiveCss')) return;", start)
              code = """\n    /* V TRADE AI MOBILE SINGLE-ROW RUNTIME v1 */\n    const markHeader=()=>{const top=document.querySelector('.top');if(top)top.classList.add('vtrade-single-row');};\n    markHeader();\n    window.addEventListener('resize',markHeader,{passive:true});\n"""
              text = text[:insert_at] + code + text[insert_at:]
              p.write_text(text, encoding='utf-8')

      - name: Remove trigger and commit
        run: |
          rm -f MOBILE_HEADER_FIX_TRIGGER
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vtrade-connection.js MOBILE_HEADER_FIX_TRIGGER
          git diff --cached --quiet && exit 0
          git commit -m "fix: single-row responsive market header"
          git push
