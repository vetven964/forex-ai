name: V TRADE AI Terminal Layout Fix

on:
  push:
    branches: [main]
    paths:
      - 'TERMINAL_LAYOUT_FIX_TRIGGER'
      - '.github/workflows/terminal-layout-fix.yml'
      - 'premium-dashboard-live.html'
      - 'pc-premium-terminal.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply responsive terminal layout
        shell: python
        run: |
          from pathlib import Path

          css = r'''
/* VTRADE-TERMINAL-RESPONSIVE-V2 */
@media(max-width:900px){
  html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
  .app{display:block!important;min-width:0!important;width:100%!important;max-width:100%!important}
  .main{min-width:0!important;width:100%!important;max-width:100%!important;overflow:hidden!important}
  .top{position:sticky!important;top:0!important;z-index:60!important;display:grid!important;grid-template-columns:42px minmax(0,1fr) auto!important;align-items:center!important;gap:7px!important;min-height:62px!important;height:62px!important;padding:7px 9px!important;overflow:hidden!important}
  .top .mobile{display:grid!important;place-items:center!important;width:42px!important;min-width:42px!important;height:42px!important;margin:0!important;grid-column:1!important;grid-row:1!important}
  .top .pair{grid-column:2!important;grid-row:1!important;min-width:0!important;width:100%!important;display:flex!important;align-items:center!important;gap:5px!important;overflow:hidden!important}
  .top .pair>div{min-width:0!important;overflow:hidden!important}
  .top .pair b{font-size:12px!important;line-height:1!important;white-space:nowrap!important}
  .top .pair .sub{font-size:8px!important;line-height:1!important;white-space:nowrap!important}
  .top .star{font-size:15px!important;flex:0 0 auto!important}
  .top .price{font-size:20px!important;line-height:1!important;white-space:nowrap!important;flex:0 0 auto!important}
  .top .backend{grid-column:3!important;grid-row:1!important;justify-self:end!important;font-size:7px!important;padding:5px 6px!important;max-width:72px!important;overflow:hidden!important;text-overflow:ellipsis!important}
  .top .tfs{grid-column:2/4!important;grid-row:2!important;display:flex!important;gap:6px!important;overflow-x:auto!important;max-width:100%!important;margin:3px 0 0!important;scrollbar-width:none!important}
  .top .tfs::-webkit-scrollbar{display:none!important}
  .top .tfs button{flex:0 0 auto!important;min-width:50px!important;min-height:40px!important;padding:8px 11px!important}
  .top .lang-row{grid-column:2/4!important;grid-row:3!important;display:flex!important;gap:6px!important;overflow:hidden!important}
  .top .lang-row>*{flex:0 0 auto!important}
  .side{position:fixed!important;left:0!important;top:0!important;bottom:0!important;width:min(300px,86vw)!important;height:100dvh!important;z-index:100!important;transform:translateX(-105%)!important;transition:transform .22s ease!important;overflow-y:auto!important;overflow-x:hidden!important}
  .side.open{transform:translateX(0)!important}
  .wrap{width:100%!important;max-width:100%!important;padding:10px!important;overflow:hidden!important}
  .cards,.radar,.gategrid,.mainrow,.news-top,.news-grid{grid-template-columns:1fr!important}
  .toolbar{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;width:100%!important;max-width:100%!important}
  .api{min-width:0!important;width:100%!important}
}
@media(max-width:520px){
  .top{grid-template-columns:40px minmax(0,1fr) auto!important;min-height:58px!important;height:auto!important;padding:7px 8px!important}
  .top .mobile{width:40px!important;min-width:40px!important;height:40px!important}
  .top .price{font-size:18px!important}
  .top .backend{font-size:6px!important;padding:4px 5px!important;max-width:66px!important}
  .top .tfs button{min-width:48px!important;min-height:38px!important}
  .card{padding:13px!important}
  .huge{font-size:29px!important}
}
@media(max-width:380px){
  .top .backend{display:none!important}
  .top .pair .sub{display:none!important}
  .top .price{font-size:17px!important}
}
@media(min-width:901px){
  .side{min-width:245px!important}
  .side-foot{margin-top:auto!important}
}
'''

          for name in ('premium-dashboard-live.html','pc-premium-terminal.html'):
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              marker='VTRADE-TERMINAL-RESPONSIVE-V2'
              if marker not in s:
                  pos=s.find('</style>')
                  if pos < 0:
                      raise SystemExit(f'style closing tag not found: {name}')
                  s=s[:pos]+css+'\n'+s[pos:]

              # Runtime: keep the mobile drawer predictable and prevent duplicate menu state.
              js=r'''
<script>
/* VTRADE-TERMINAL-RESPONSIVE-RUNTIME-V2 */
(function(){
  function bind(){
    const menu=document.getElementById('menu');
    const side=document.getElementById('side');
    const scrim=document.getElementById('scrim');
    if(!menu||!side||!scrim||menu.dataset.vtradeBound==='1') return;
    menu.dataset.vtradeBound='1';
    const close=()=>{side.classList.remove('open');scrim.classList.remove('show');document.body.style.overflow='';};
    menu.addEventListener('click',()=>{side.classList.add('open');scrim.classList.add('show');});
    scrim.addEventListener('click',close);
    window.addEventListener('resize',()=>{if(window.innerWidth>900)close();},{passive:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind,{once:true});else bind();
})();
</script>
'''
              if 'VTRADE-TERMINAL-RESPONSIVE-RUNTIME-V2' not in s:
                  end=s.rfind('</body>')
                  if end>=0:
                      s=s[:end]+js+s[end:]
              p.write_text(s,encoding='utf-8')

      - name: Commit terminal layout patch
        run: |
          rm -f TERMINAL_LAYOUT_FIX_TRIGGER
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add premium-dashboard-live.html pc-premium-terminal.html TERMINAL_LAYOUT_FIX_TRIGGER .github/workflows/terminal-layout-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: responsive terminal header sidebar and mobile flow'
          git push
