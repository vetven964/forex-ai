name: V TRADE AI Terminal Layout Fix

on:
  push:
    branches: [main]
    paths:
      - 'TERMINAL_LAYOUT_FIX_TRIGGER'
      - '.github/workflows/terminal-layout-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive terminal layout v3
        shell: python
        run: |
          from pathlib import Path
          css=r'''
/* VTRADE-TERMINAL-RESPONSIVE-V3 */
@media(max-width:900px){
 html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
 .app,.main,.wrap{width:100%!important;max-width:100%!important;min-width:0!important}
 .top{position:sticky!important;top:0!important;z-index:60!important;display:grid!important;grid-template-columns:40px minmax(0,1fr) auto!important;grid-template-rows:42px 40px!important;gap:6px!important;min-height:90px!important;height:90px!important;padding:7px 8px!important;overflow:hidden!important}
 .top .mobile{display:grid!important;grid-column:1!important;grid-row:1!important;width:40px!important;height:40px!important;min-width:40px!important}
 .top .pair{grid-column:2!important;grid-row:1!important;min-width:0!important;overflow:hidden!important;display:flex!important;align-items:center!important;gap:4px!important}
 .top .pair>div{min-width:0!important;overflow:hidden!important}
 .top .pair b{font-size:12px!important;white-space:nowrap!important}
 .top .pair .sub{font-size:8px!important;white-space:nowrap!important}
 .top .star{font-size:14px!important;flex:0 0 auto!important}
 .top .price{font-size:20px!important;white-space:nowrap!important;flex:0 0 auto!important}
 .top .backend{grid-column:3!important;grid-row:1!important;font-size:7px!important;padding:5px!important;max-width:70px!important;white-space:nowrap!important}
 .top .tfs{grid-column:2/4!important;grid-row:2!important;margin:0!important;display:block!important;min-width:0!important;overflow:visible!important}
 .top .tfs button{display:none!important}
 .vtrade-mobile-tf-select{display:block!important;width:100%!important;height:40px!important;border:1px solid var(--line)!important;border-radius:11px!important;background:#09111e!important;color:#fff!important;padding:0 10px!important;font-weight:800!important}
 .top .lang-row{position:absolute!important;right:8px!important;bottom:7px!important;z-index:2!important}
 .top .lang-row .lang-btn{display:none!important}
 .vtrade-mobile-lang-select{display:block!important;width:92px!important;height:40px!important;border:1px solid var(--line)!important;border-radius:11px!important;background:#09111e!important;color:#fff!important;padding:0 8px!important;font-weight:800!important}
 .wrap{padding:10px!important;overflow:hidden!important}
 .cards,.radar,.gategrid,.mainrow,.news-top,.news-grid{grid-template-columns:1fr!important}
 .wrap .tfs,.wrap .tf-buttons,.wrap .timeframe-buttons{display:flex!important;width:100%!important;min-width:0!important;overflow-x:auto!important;scrollbar-width:none!important;gap:7px!important}
 .wrap .tfs::-webkit-scrollbar,.wrap .tf-buttons::-webkit-scrollbar,.wrap .timeframe-buttons::-webkit-scrollbar{display:none!important}
 .wrap .tfs button,.wrap .tf-buttons button,.wrap .timeframe-buttons button{flex:0 0 auto!important;min-width:54px!important;white-space:nowrap!important}
 .side{position:fixed!important;left:0!important;top:0!important;bottom:0!important;width:min(300px,82vw)!important;height:100dvh!important;z-index:100!important;transform:translateX(-105%)!important;overflow-y:auto!important;overflow-x:hidden!important}
 .side.open{transform:translateX(0)!important}
 .scrim{z-index:90!important}
}
@media(max-width:520px){.top{min-height:90px!important;height:90px!important}.top .price{font-size:19px!important}.top .pair .sub{display:none!important}.top .backend{max-width:66px!important;font-size:6px!important}.vtrade-mobile-lang-select{width:88px!important}}
@media(max-width:380px){.top .backend{display:none!important}.top .price{font-size:18px!important}.vtrade-mobile-lang-select{width:84px!important}}
@media(min-width:901px){.vtrade-mobile-tf-select,.vtrade-mobile-lang-select{display:none!important}}
'''
          js=r'''
<script>
/* VTRADE-TERMINAL-RESPONSIVE-RUNTIME-V3 */
(function(){
 function tfVal(t){t=String(t||'').trim().toUpperCase();return ['M5','M15','H1','H4','D1'].includes(t)?t:''}
 function run(){
  const top=document.querySelector('.top');if(!top)return;top.classList.add('vtrade-clean-header');
  const tf=top.querySelector('.tfs');
  if(tf&&!tf.querySelector('.vtrade-mobile-tf-select')){
   const s=document.createElement('select');s.className='vtrade-mobile-tf-select';
   ['M5','M15','H1','H4','D1'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)});
   const a=tf.querySelector('button.active');if(a)s.value=tfVal(a.textContent)||'M15';
   s.onchange=()=>{const b=[...tf.querySelectorAll('button')].find(x=>tfVal(x.textContent)===s.value);if(b)b.click()};tf.appendChild(s);
  }
  const lr=top.querySelector('.lang-row');
  if(lr&&!lr.querySelector('.vtrade-mobile-lang-select')){
   const s=document.createElement('select');s.className='vtrade-mobile-lang-select';
   const bs=[...lr.querySelectorAll('.lang-btn')];bs.forEach((b,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=b.textContent.trim();s.appendChild(o)});
   s.onchange=()=>{const b=bs[Number(s.value)];if(b)b.click()};lr.appendChild(s);
  }
  const menu=document.getElementById('menu'),side=document.getElementById('side'),scrim=document.getElementById('scrim');
  if(menu&&side&&scrim&&!menu.dataset.v3){menu.dataset.v3='1';menu.onclick=()=>{side.classList.add('open');scrim.classList.add('show')};scrim.onclick=()=>{side.classList.remove('open');scrim.classList.remove('show')}}
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
 new MutationObserver(run).observe(document.body,{childList:true,subtree:true});
})();
</script>
'''
          for name in ('premium-dashboard-live.html','pc-premium-terminal.html'):
           p=Path(name)
           if not p.exists(): continue
           s=p.read_text(encoding='utf-8')
           if 'VTRADE-TERMINAL-RESPONSIVE-V3' not in s:
            pos=s.find('</style>');
            if pos<0: raise SystemExit('style closing tag not found: '+name)
            s=s[:pos]+css+'\n'+s[pos:]
           if 'VTRADE-TERMINAL-RESPONSIVE-RUNTIME-V3' not in s:
            end=s.rfind('</body>');
            if end<0: raise SystemExit('body closing tag not found: '+name)
            s=s[:end]+js+s[end:]
           p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          rm -f TERMINAL_LAYOUT_FIX_TRIGGER
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add premium-dashboard-live.html pc-premium-terminal.html TERMINAL_LAYOUT_FIX_TRIGGER .github/workflows/terminal-layout-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: mobile terminal responsive selectors v3'
          git push
