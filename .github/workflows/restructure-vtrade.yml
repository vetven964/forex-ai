name: V TRADE Structure Migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild clean server/ui structure
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f server/server.js && -f ui/dashboard.html ]]; then
            echo "[V-TRADE STRUCTURE] already migrated"
            exit 0
          fi

          mkdir -p server ui

          # UI JavaScript stays beside the UI pages. All other root JS is server/runtime code.
          ui_js=(
            auth-register.js
            frontend-admin-hotfix.js
            mobile-first-workflow-v1.js
            mtf-dashboard-adapter.js
            pre-market-authority-ui-hotfix.js
            pre-market-intelligence-ui.js
            pre-market-post-open-ai.js
            pwa.js
            site-connection.js
            sw.js
            telegram-auto-scan-guard.js
            telegram-auto-watchdog.js
            terminal-pre-market.js
            terminal-watchdog.js
            vtrade-admin-menu-all-session.js
            vtrade-ai-button-hotfix.js
            vtrade-connection.js
            vtrade-logic-ui-hotfix.js
            vtrade-rbac-guard.js
          )

          for f in "${ui_js[@]}"; do
            [[ -f "$f" ]] && git mv "$f" "ui/$f"
          done

          # All HTML is UI. The premium live terminal becomes the one Main Dashboard.
          for f in *.html; do
            [[ -e "$f" ]] || continue
            case "$f" in
              dashboard.html|account-terminal.html|ai-desk.html|admin-dashboard.html|phone-admin.html|phone-center.html|register-v2.html|connection.html)
                git rm -f "$f"
                ;;
              premium-dashboard-live.html)
                git mv "$f" "ui/dashboard.html"
                ;;
              *)
                git mv "$f" "ui/$f"
                ;;
            esac
          done

          # Remove the duplicate legacy frontend login page.
          if [[ -f frontend/login.html ]]; then git rm -f frontend/login.html; fi
          rmdir frontend 2>/dev/null || true

          # UI assets/styles/manifests belong to the UI folder.
          for f in *.css *.webmanifest; do
            [[ -e "$f" ]] && git mv "$f" "ui/$f"
          done
          [[ -d icons ]] && git mv icons ui/icons

          # Backend/core and MT5 execution files are server-side assets.
          [[ -d backend ]] && git mv backend server/backend
          [[ -d core ]] && git mv core server/core
          [[ -d MT5 ]] && git mv MT5 server/MT5

          # Server/runtime JS files are moved after the UI allow-list is handled.
          for f in *.js; do
            [[ -e "$f" ]] || continue
            git mv "$f" "server/$f"
          done

          # Clean the old patch workflows. Render is the deployment system; these old
          # self-modifying hotfix workflows caused repeated root-file drift.
          find .github/workflows -maxdepth 1 -type f -name '*.yml' ! -name 'restructure-vtrade.yml' -delete

          # Launcher paths: server code is now in /server and the canonical dashboard is /ui/dashboard.html.
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server/vtrade-enhanced-launcher.js')
          s = p.read_text()
          s = s.replace("path.join(ROOT,'premium-dashboard-live.html')", "path.join(ROOT,'../ui/dashboard.html')")
          s = s.replace("path.join(ROOT,'pre-market-intelligence-ui.js')", "path.join(ROOT,'../ui/pre-market-intelligence-ui.js')")
          s = s.replace("path.join(ROOT,'pre-market-post-open-ai.js')", "path.join(ROOT,'../ui/pre-market-post-open-ai.js')")
          s = s.replace("path.join(ROOT,'pre-market-authority-ui-hotfix.js')", "path.join(ROOT,'../ui/pre-market-authority-ui-hotfix.js')")
          marker = "// Package/RBAC gate: demo users see the dashboard shell; purchased plans unlock features.\ntry { require('./package-access-hotfix.js'); console.log('[V-TRADE START] Package/RBAC access gate loaded'); } catch (e) { console.error('[V-TRADE PACKAGE] FATAL:', e.stack || e.message); throw e; }\n\n"
          if 'package-access-hotfix.js' not in s:
              s = s.replace("// Pre-Market route boot hotfix MUST run before server.js is required.", marker + "// Pre-Market route boot hotfix MUST run before server.js is required.")
          p.write_text(s)

          # The package hotfix must target the new canonical dashboard path.
          p = Path('server/package-access-hotfix.js')
          s = p.read_text()
          s = s.replace("path.resolve(__dirname,'premium-dashboard-live.html')", "path.resolve(__dirname,'../ui/dashboard.html')")
          p.write_text(s)

          # Predeploy consistency hotfix patches UI files from the server folder.
          p = Path('server/predeploy-consistency-hotfix.js')
          s = p.read_text()
          s = s.replace("path.join(ROOT, 'terminal-pre-market.js')", "path.join(ROOT, '../ui/terminal-pre-market.js')")
          s = s.replace("path.join(ROOT, 'vtrade-ai-button-hotfix.js')", "path.join(ROOT, '../ui/vtrade-ai-button-hotfix.js')")
          p.write_text(s)

          # Serve UI from /ui while keeping clean public URLs (/login.html, /dashboard.html, etc.).
          p = Path('server/server.js')
          s = p.read_text()
          anchor = "const app = express();"
          boot = """const app = express();
const UI_ROOT = path.resolve(__dirname, '../ui');
// Canonical UI root: all browser pages live under /ui in the repository,
// while public URLs remain simple (/login.html, /register.html, /dashboard.html).
app.use(express.static(UI_ROOT, { index: 'index.html', fallthrough: true, maxAge: '1h' }));
app.get('/', (_req, res) => res.sendFile(path.join(UI_ROOT, 'index.html')));
"""
          if "const UI_ROOT = path.resolve(__dirname, '../ui')" not in s:
              s = s.replace(anchor, boot, 1)
          p.write_text(s)

          # Root package/render entry points now launch the server from /server.
          p = Path('package.json')
          s = p.read_text().replace('"start": "node vtrade-enhanced-launcher.js"', '"start": "node server/vtrade-enhanced-launcher.js"')
          s = s.replace('"main": "server.js"', '"main": "server/server.js"')
          p.write_text(s)

          p = Path('render.yaml')
          s = p.read_text().replace('startCommand: node server-launcher.js', 'startCommand: node server/vtrade-enhanced-launcher.js')
          p.write_text(s)

          # Main portal: only the requested four links remain.
          p = Path('ui/index.html')
          s = '''<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050912"><title>V TRADE AI — Main Portal</title>
          <style>:root{--bg:#04070d;--line:#233552;--text:#f5f8ff;--muted:#8d9bb0;--cyan:#35d8ff;--purple:#8050ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#281450,transparent 32%),radial-gradient(circle at 90% 5%,#073c43,transparent 30%),var(--bg);color:var(--text);font:14px Segoe UI,Arial,sans-serif}.shell{width:min(1100px,92%);margin:auto}.top{min-height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;margin-right:auto}.logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;font-weight:950;background:linear-gradient(135deg,#5120ff,#aa72ff)}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{color:#b8c5d8;text-decoration:none;border:1px solid var(--line);background:#09111e;padding:10px 13px;border-radius:10px;font-weight:800}.nav a:hover{border-color:var(--purple);color:#fff}.nav .primary{background:linear-gradient(135deg,#5421cf,#7136e8);border-color:var(--purple);color:#fff}.hero{text-align:center;padding:90px 10px 45px}.badge{display:inline-block;padding:7px 11px;border:1px solid #31566c;border-radius:99px;background:#0a1824;color:#9deee3;font-size:10px;font-weight:900}.hero h1{font-size:clamp(38px,7vw,68px);margin:18px 0 10px}.hero p{max-width:760px;margin:auto;color:var(--muted);line-height:1.8}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#0b1423f5,#070c15f5)}.card h3{margin:0 0 8px}.card p{color:var(--muted);line-height:1.6;margin:0}.actions{display:flex;justify-content:center;gap:10px;margin:28px 0}.btn{display:inline-block;text-decoration:none;color:#fff;border:1px solid var(--line);background:#09111e;padding:13px 20px;border-radius:12px;font-weight:900}.primary{background:linear-gradient(135deg,#5421cf,#7136e8);border-color:var(--purple)}footer{text-align:center;color:#64738a;font-size:10px;padding:35px 0}@media(max-width:700px){.top{height:auto;padding:14px 0;align-items:flex-start;flex-direction:column}.nav{width:100%}.nav a{flex:1;text-align:center}.hero{padding:55px 5px 30px}.cards{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr}.btn{text-align:center}}</style></head>
          <body><div class="shell"><header class="top"><a class="brand" href="/"><span class="logo">V</span><span><b>V TRADE AI</b><small style="display:block;color:#8d9bb0;font-size:10px;margin-top:3px">ICT Smart Trading Terminal</small></span></a><nav class="nav" aria-label="Main navigation"><a href="https://github.com/vetven964/forexai" target="_blank" rel="noopener noreferrer">GitHub</a><a href="/login.html">Login</a><a href="/register.html">Register</a><a class="primary" href="/dashboard.html">Dashboard</a></nav></header><main><section class="hero"><span class="badge">XAUUSD · ICT · MTF · AI</span><h1>V TRADE AI</h1><p>New users can register and enter the Demo Dashboard. Live terminal, signals, AI, news, Telegram, risk and history features are locked until the account has a purchased package.</p><div class="actions"><a class="btn primary" href="/dashboard.html">Open Dashboard</a><a class="btn" href="/login.html">Login</a><a class="btn" href="/register.html">Register</a></div></section><section class="cards"><article class="card"><h3>Main Dashboard</h3><p>One dashboard contains Terminal, Signals, AI Intelligence, News, Telegram, Risk, History and Settings.</p></article><article class="card"><h3>Demo for New Users</h3><p>Registration and login work without payment. The dashboard shell is visible, while paid features remain locked.</p></article><article class="card"><h3>Paid Package Access</h3><p>Purchased package features are enabled by the server-side package gate. Admin accounts keep full access.</p></article></section></main><footer>V TRADE AI · GitHub · Login · Register · Dashboard</footer></div></body></html>'''
          p.write_text(s.strip() + '\n')

          # Login/Register must never load Terminal/Pre-Market UI. They only authenticate and link to Main Dashboard.
          for name in ('ui/login.html','ui/register.html'):
              p = Path(name)
              if not p.exists(): continue
              s = p.read_text()
              for src in ('terminal-pre-market.js','vtrade-rbac-guard.js'):
                  s = s.replace(f'<script src="{src}"></script>', '')
              s = s.replace('dashboard.html', '/dashboard.html')
              s = s.replace('location.replace(\'connection.html?required=login&flow=auth\')', "location.replace('/dashboard.html')")
              s = s.replace('location.replace("connection.html?required=login&flow=auth")', "location.replace('/dashboard.html')")
              p.write_text(s)

          # Remove accidental temporary files if present.
          for f in tmp.txt tmp2.txt tmp3.txt tmp4.txt tmp5.txt tmp6.txt tmp7.txt tmp8.txt:
              [[ -f "$f" ]] && git rm -f "$f"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: clean V TRADE server ui architecture' || exit 0
          git push
