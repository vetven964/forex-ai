name: Terminal Link Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/terminal-link-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Route Terminal to Premium Live UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- VTRADE TERMINAL LINK HOTFIX V1 -->'
          if marker in s:
              print('Terminal link hotfix already installed')
              raise SystemExit(0)

          # The existing Terminal controls use switchTab('terminal-analysis').
          # Replace only those Terminal navigation handlers with the live premium route.
          replacements = [
              ("onclick=\"switchTab('terminal-analysis')\"", "onclick=\"window.location.href='premium-dashboard-live.html'\""),
              ("onclick=\"switchTab('terminal-analysis'); toggleMobileMenu();\"", "onclick=\"window.location.href='premium-dashboard-live.html'\""),
          ]
          changed = 0
          for old, new in replacements:
              n = s.count(old)
              if n:
                  s = s.replace(old, new)
                  changed += n

          if not changed:
              raise SystemExit('Terminal navigation anchor not found')

          s = s.replace('<head>', '<head>\n<!-- VTRADE TERMINAL LINK HOTFIX V1 -->', 1)
          p.write_text(s, encoding='utf-8')
          print(f'Patched {changed} Terminal navigation control(s)')

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: route terminal link to premium live UI'
          git push
