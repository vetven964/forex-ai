name: V TRADE AI Zone Both-Sides Fix

on:
  push:
    branches: [main]
    paths:
      - 'ZONE_BOTH_SIDES_FIX_TRIGGER'
      - '.github/workflows/zone-both-sides-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix engine to expose both zones
        shell: python
        run: |
          from pathlib import Path
          p = Path('pre-market-candle-open-engine.js')
          s = p.read_text(encoding='utf-8')
          old = """    const buyZone=bias==='BULLISH'&&currentPrice!=null?[currentPrice-zoneWidth,currentPrice]:null;\n    const sellZone=bias==='BEARISH'&&currentPrice!=null?[currentPrice,currentPrice+zoneWidth]:null;"""
          new = """    // Zone map is intentionally two-sided: pre-market identifies BOTH possible entry areas.\n    // Direction strength is evidence, not permission to hide the opposite zone.\n    const buyZone=currentPrice!=null?[currentPrice-zoneWidth,currentPrice-zoneWidth*.20]:null;\n    const sellZone=currentPrice!=null?[currentPrice+zoneWidth*.20,currentPrice+zoneWidth]:null;"""
          if old not in s:
              raise SystemExit('Expected one-sided zone logic not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Fix UI to show BUY ZONE and SELL ZONE separately
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('terminal-pre-market.js')
          s = p.read_text(encoding='utf-8')

          helper = """  function zoneRange(z) {\n    if (!Array.isArray(z) || z.length < 2) return '—';\n    const a=n(z[0]), b=n(z[1]);\n    return a==null || b==null ? '—' : `${fmt(Math.min(a,b))} – ${fmt(Math.max(a,b))}`;\n  }\n"""
          marker = "  function gate(label,value,detail='') {"
          if 'function zoneRange(z)' not in s:
              if marker not in s:
                  raise SystemExit('UI helper marker not found')
              s = s.replace(marker, helper + marker, 1)

          pattern = re.compile(r'<div class="v5-box"><div class="v5-label">\$\{tr\(\'Buyer / Seller Power\'.*?(?=<div class="v5-box v5-mtf">)', re.S)
          replacement = """<div class=\"v5-box\"><div class=\"v5-label\">${tr('BUY ZONE / SELL ZONE','តំបន់ BUY / SELL')}</div><div class=\"v5-grid\" style=\"margin-top:8px\"><div><div class=\"v5-label\">BUY ZONE</div><div class=\"v5-score v5-buy\" style=\"font-size:22px\">${zoneRange(d.zone?.buyZone)}</div><div class=\"v5-row\"><span>Entry area</span><b class=\"v5-buy\">BELOW PRICE</b></div></div><div><div class=\"v5-label\">SELL ZONE</div><div class=\"v5-score v5-sell\" style=\"font-size:22px\">${zoneRange(d.zone?.sellZone)}</div><div class=\"v5-row\"><span>Entry area</span><b class=\"v5-sell\">ABOVE PRICE</b></div></div></div><div class=\"v5-row\"><span>${tr('Market pressure','សម្ពាធទីផ្សារ')}</span><b class=\"${buy>sell?'v5-buy':sell>buy?'v5-sell':'v5-neutral'}\">${buy>sell?'BUY PRESSURE':sell>buy?'SELL PRESSURE':'BALANCED'}</b></div><div class=\"v5-row\"><span>Buyer / Seller</span><b>${buyer}% / ${seller}%</b></div><div class=\"v5-note\">${tr('Both zones stay visible. Pressure only ranks the current market; it does not remove the opposite setup. Entry requires ICT confirmation gates.','បង្ហាញទាំងពីរតំបន់ជានិច្ច។ Pressure គ្រាន់តែបង្ហាញសម្ពាធបច្ចុប្បន្ន មិនលុប setup ផ្ទុយទេ។ Entry ត្រូវរង់ចាំ ICT confirmation gates។')}</div></div>"""
          ns, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Expected BUY/SELL UI block once, found {count}')
          p.write_text(ns, encoding='utf-8')

      - name: Remove trigger and commit
        shell: bash
        run: |
          rm -f ZONE_BOTH_SIDES_FIX_TRIGGER
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pre-market-candle-open-engine.js terminal-pre-market.js ZONE_BOTH_SIDES_FIX_TRIGGER .github/workflows/zone-both-sides-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: show independent buy and sell pre-market zones'
          git push
