name: Fix Telegram WAIT source formatter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: Telegram WAIT source formatter'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch server.js
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('server.js')
          s = p.read_text(encoding='utf-8')

          pattern = r"function telegramWaitText\(a\) \{.*?\n\}\n\nfunction telegramText"
          replacement = r'''function telegramWaitText(a) {
  const score = Number(a?.directionScore ?? a?.aiScore ?? 0);
  const bias = String(a?.bias || a?.directionBand || 'NEUTRAL').toUpperCase();
  const confidence = Number(a?.confidence ?? a?.score?.confluence ?? 0);
  const ai = a?.aiConfirmation || {};
  const aiDecision = String(ai?.decision ?? 'WAIT');
  const aiConfidence = Number.isFinite(Number(ai?.confidence)) ? Number(ai.confidence) : 0;
  const aiAgreement = String(ai?.agreement ?? 'NEUTRAL');
  const blocked = Array.isArray(a?.score?.blockedReasons)
    ? a.score.blockedReasons.slice(0, 8).map(x => String(x ?? '').trim()).filter(Boolean)
    : [];
  const has = pattern => blocked.some(x => pattern.test(x));
  const gate = (failed, waiting='⏳ WAITING') => failed ? '❌ NOT CONFIRMED' : waiting;
  const action = bias === 'BULLISH'
    ? '🟡 WAIT — BUY BIAS'
    : bias === 'BEARISH'
      ? '🟡 WAIT — SELL BIAS'
      : '🟡 WAIT — NO ENTRY';
  const executionZone = /premium/i.test(blocked.join(' | '))
    ? '⏳ WAIT FOR DISCOUNT'
    : '⏳ WAITING';

  return `🤖 *V TRADE AI — ADVANCED ICT SIGNAL*\n\n` +
    `📊 Asset: *XAU/USD (Gold)*\n` +
    `💰 Price: *${formatPrice(a?.livePrice ?? a?.bid)}*\n` +
    `⚡ Action: *${action}*\n\n` +
    `📈 Bias: *${bias}* | Direction Score: *${score}/100* | Confidence: *${confidence}/100*\n\n` +
    `🔎 *ICT ENTRY GATES*\n` +
    `💧 Liquidity Sweep: *${gate(has(/liquidity sweep/i))}*\n` +
    `📐 M5 MSS: *${gate(has(/Fresh M5 MSS not confirmed|M5 MSS not confirmed/i))}*\n` +
    `💥 Displacement: *${gate(has(/displacement/i))}*\n` +
    `🏗️ M5 MSS/BOS: *${gate(has(/MSS\/BOS|structure break/i))}*\n` +
    `📊 ADX Gate: *${has(/ADX/i) ? '❌ TOO WEAK' : '⏳ WAITING'}*\n` +
    `📍 Execution Zone: *${executionZone}*\n\n` +
    `🤖 AI Confirm: *${aiDecision}* | Confidence: *${aiConfidence}/100* | Agreement: *${aiAgreement}*\n\n` +
    `🎯 Entry Zone: *WAITING FOR CONFIRMATION*\n` +
    `🛑 Stop Loss (SL): *—*\n` +
    `🎯 Take Profit 1 (TP1): *—*\n` +
    `🎯 Take Profit 2 (TP2): *—*\n` +
    `🎯 Take Profit 3 (TP3): *—*\n\n` +
    `⚡ Status: *WAIT — NO ORDER AUTHORIZED*\n` +
    `⏳ ${String(a?.status || 'WAIT — confirmation pending')}\n\n` +
    `🏦 Broker: *VT Markets MT5* | Quote age: *${a?.priceAgeSec ?? '—'}s*\n` +
    `🔒 *WAIT only — no order is authorized until all entry gates pass.*`;
}

function telegramText'''

          new_s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('telegramWaitText source block not found; refusing to modify server.js')
          p.write_text(new_s, encoding='utf-8')
          print('server.js telegramWaitText replaced:', count)

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-telegram-wait-root.yml
          git add server.js .github/workflows/fix-telegram-wait-root.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: Telegram WAIT source formatter"
          git push