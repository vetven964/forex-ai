name: V5 dashboard cache refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[v5-cache-refreshed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh V5 iframe cache key
        shell: python
        run: |
          from pathlib import Path
          p = Path('premium-dashboard-v5.html')
          s = p.read_text(encoding='utf-8')
          old = 'premium-dashboard-live.html?v=20260817-news-bilingual-2'
          new = 'premium-dashboard-live.html?v=20260818-logic-mtf-candles-1'
          if old not in s:
              raise SystemExit('old V5 iframe cache key not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit refresh and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add premium-dashboard-v5.html
          git commit -m "refresh V5 dashboard for MTF logic [v5-cache-refreshed]"
          rm -f .github/workflows/v5-cache-bust.yml
          git add -u .github/workflows/v5-cache-bust.yml
          git commit -m "remove temporary V5 cache workflow"
          git push
