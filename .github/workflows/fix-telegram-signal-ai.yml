name: Fix Telegram Signal AI Confirmation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: run OpenAI confirmation in Telegram /signal'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch server.js
        shell: python
        run: |
          from pathlib import Path

          p = Path('server.js')
          s = p.read_text(encoding='utf-8')

          old = '''  bot.onText(/^\\/signal$/,async msg=>{
    try {
      const a=await buildXauAnalysis();
      const isEntry=['BUY','SELL'].includes(String(a?.signal||'')) &&
        (a?.status === 'ENTRY CONFIRMED' || String(a?.status||'').includes('ENTRY CONFIRMED')) &&
        Number.isFinite(Number(a?.entry)) &&
        (a?.bestOpportunity || a?.confirmations?.allGatesPassed === true);
      await bot.sendMessage(msg.chat.id, isEntry ? telegramText(a) : telegramWaitText(a));
    } catch(e){
      const reason=String(e?.message||'Unknown analysis error');
      console.error(`[TELEGRAM /signal] Analysis blocked: ${reason}`);
      if (analysisCache.data) {
        const cached={...analysisCache.data,cached:true,cacheAgeSec:Math.max(0,Math.round((Date.now()-analysisCache.at)/1000))};
        const isEntry=['BUY','SELL'].includes(String(cached?.signal||'')) &&
          (cached?.status === 'ENTRY CONFIRMED' || String(cached?.status||'').includes('ENTRY CONFIRMED')) &&
          Number.isFinite(Number(cached?.entry)) &&
          (cached?.bestOpportunity || cached?.confirmations?.allGatesPassed === true);
        await bot.sendMessage(msg.chat.id, isEntry ? telegramText(cached) : telegramWaitText(cached));
      } else {
        await bot.sendMessage(msg.chat.id,`⚠️ ICT analysis unavailable.\\nReason: ${reason.slice(0,220)}`);
      }
    }
  });'''

          new = '''  bot.onText(/^\\/signal$/,async msg=>{
    try {
      const a=await buildXauAnalysis();
      // Run the same OpenAI confirmation layer used by the auto scanner so manual
      // /signal reports never show AI Confirm: NOT RUN when OpenAI is enabled.
      const ai = OPENAI_ENABLED
        ? await openAIConfirmXauAnalysis(a)
        : {enabled:false,configured:!!OPENAI_API_KEY,model:OPENAI_MODEL,status:'disabled'};
      a.aiConfirmation = ai;
      if (OPENAI_ENABLED && OPENAI_API_KEY) {
        console.log(`[AI CONFIRM /signal] status=${ai.status} decision=${ai.decision || 'WAIT'} confidence=${ai.confidence ?? 0} agreement=${ai.agreement || 'NEUTRAL'} final=${ai.gate?.finalSignal || 'WAIT'}`);
      }

      const isEntry=['BUY','SELL'].includes(String(a?.signal||'')) &&
        (a?.status === 'ENTRY CONFIRMED' || String(a?.status||'').includes('ENTRY CONFIRMED')) &&
        Number.isFinite(Number(a?.entry)) &&
        (a?.bestOpportunity || a?.confirmations?.allGatesPassed === true);
      await bot.sendMessage(msg.chat.id, isEntry ? telegramText(a) : telegramWaitText(a));
    } catch(e){
      const reason=String(e?.message||'Unknown analysis error');
      console.error(`[TELEGRAM /signal] Analysis blocked: ${reason}`);
      if (analysisCache.data) {
        const cached={...analysisCache.data,cached:true,cacheAgeSec:Math.max(0,Math.round((Date.now()-analysisCache.at)/1000))};
        const isEntry=['BUY','SELL'].includes(String(cached?.signal||'')) &&
          (cached?.status === 'ENTRY CONFIRMED' || String(cached?.status||'').includes('ENTRY CONFIRMED')) &&
          Number.isFinite(Number(cached?.entry)) &&
          (cached?.bestOpportunity || cached?.confirmations?.allGatesPassed === true);
        await bot.sendMessage(msg.chat.id, isEntry ? telegramText(cached) : telegramWaitText(cached));
      } else {
        await bot.sendMessage(msg.chat.id,`⚠️ ICT analysis unavailable.\\nReason: ${reason.slice(0,220)}`);
      }
    }
  });'''

          if new in s:
              print('server.js already patched')
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Target /signal block not found; refusing to modify server.js')

          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Patched server.js /signal OpenAI confirmation')

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-telegram-signal-ai.yml
          git add server.js .github/workflows/fix-telegram-signal-ai.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: run OpenAI confirmation in Telegram /signal"
          git push
