name: V-TRADE AI logic patch

on:
  push:
    paths:
      - '.github/workflows/vtrade-logic-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch production logic
        shell: python
        run: |
          from pathlib import Path

          server = Path('server.js')
          s = server.read_text(encoding='utf-8')

          marker = "const USER_ACCOUNTS = loadUserAccounts();"
          inject = r'''const USER_ACCOUNTS = loadUserAccounts();
const REGISTERED_USER_IDS = new Set();
async function restoreRegisteredUsers() {
  try {
    const events = await storage.getHistory({type:'user_account', limit:5000});
    const latest = new Map();
    for (const row of events || []) {
      const p = row?.payload || {};
      if (p.id && p.email) latest.set(String(p.id), p);
    }
    for (const p of latest.values()) {
      if (String(p.status || 'ACTIVE') === 'DISABLED') continue;
      if (USER_ACCOUNTS.some(u => String(u.id) === String(p.id))) continue;
      USER_ACCOUNTS.push({
        id:String(p.id), email:String(p.email).toLowerCase(), name:String(p.name || p.email).slice(0,80),
        role:String(p.role || 'user') === 'admin' ? 'admin' : 'user', plan:String(p.plan || 'trial').slice(0,40),
        passwordHash:'', enabled:p.enabled !== false
      });
      REGISTERED_USER_IDS.add(String(p.id));
    }
    console.log(`[AUTH] Restored ${REGISTERED_USER_IDS.size} registered member(s)`);
  } catch (e) { console.error('[AUTH] Registered member restore failed:', e.message); }
}
'''
          if marker in s and 'REGISTERED_USER_IDS' not in s:
              s = s.replace(marker, inject, 1)

          marker = "app.get('/api/pricing', requireAuth, (req,res) => {"
          public_route = r'''app.get('/api/public/pricing', (_req,res) => {
  res.set('Cache-Control','no-store');
  res.json({success:true,plans:pricingPlans.map(p=>({id:p.id,name:p.name,price:p.price,period:p.period,enabled:p.enabled!==false,features:p.features||[]}))});
});

'''
          if marker in s and "'/api/public/pricing'" not in s:
              s = s.replace(marker, public_route + marker, 1)

          marker = "app.post('/api/auth/login', rateLimit({"
          register_route = r'''app.post('/api/auth/register', rateLimit({windowMs:15*60_000,max:8,standardHeaders:true,legacyHeaders:false}), async (req,res) => {
  try {
    const name=String(req.body?.name||'').trim().slice(0,80);
    const email=String(req.body?.email||'').trim().toLowerCase();
    const password=String(req.body?.password||'');
    const requestedPlan=String(req.body?.plan||'trial').trim().toLowerCase();
    if(!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !password) return res.status(400).json({success:false,error:'Name, valid email and password are required'});
    if(!passwordPolicy(password)) return res.status(400).json({success:false,error:'Password must be at least 12 characters and include uppercase, lowercase, number and symbol'});
    if(ADMIN_EMAIL && email===ADMIN_EMAIL) return res.status(409).json({success:false,error:'This email is reserved for the administrator'});
    if(USER_ACCOUNTS.some(u=>u.enabled!==false && String(u.email).toLowerCase()===email)) return res.status(409).json({success:false,error:'An account with this email already exists'});
    const dbStatus=await storage.getStatus();
    if(process.env.RENDER && (!dbStatus.databaseConfigured || dbStatus.mode!=='postgres' || !dbStatus.connected)) return res.status(503).json({success:false,error:'Member registration requires the persistent PostgreSQL database on Render. Configure DATABASE_URL first.'});
    const plan=pricingPlans.find(p=>String(p.id).toLowerCase()===requestedPlan && p.enabled!==false) || pricingPlans.find(p=>String(p.id).toLowerCase()==='trial') || pricingPlans[0];
    if(!plan) return res.status(503).json({success:false,error:'No active pricing plan is available'});
    const id='user-'+crypto.randomBytes(12).toString('hex');
    const passwordHash=hashPassword(password);
    const user={id,email,name,role:'user',plan:String(plan.id),permissions:['terminal','pricing','telegram:own','profile:own'],twoFactorEnabled:false};
    await storage.saveAuthCredential(id,passwordHash);
    const saved=await storage.saveEvent('user_account',null,{id,email,name,role:'user',plan:String(plan.id),enabled:true,status:'ACTIVE',createdAt:new Date().toISOString()});
    if(!saved) throw new Error('Account record could not be persisted');
    USER_ACCOUNTS.push({...user,passwordHash,enabled:true});
    REGISTERED_USER_IDS.add(id);
    try {
      if(bot && TELEGRAM_CHAT_ID) await bot.sendMessage(TELEGRAM_CHAT_ID,`🆕 V TRADE AI — NEW MEMBER\n\n👤 Name: ${name}\n📧 Email: ${email}\n💎 Plan: ${plan.name}\n🟢 Status: ACTIVE\n🕒 Created: ${new Date().toISOString()}`);
    } catch (_) {}
    const token=createAuthSession(user); setAuthCookie(res,token); res.set('Cache-Control','no-store');
    res.status(201).json({success:true,created:true,user,token,expiresAt:Date.now()+AUTH_SESSION_TTL_MS,message:'Account created successfully'});
  } catch(e) { console.error('[AUTH] Registration failed:',e.message); res.status(500).json({success:false,error:'Account registration failed'}); }
});

'''
          if marker in s and "'/api/auth/register'" not in s:
              s = s.replace(marker, register_route + marker, 1)

          init_marker = "await storage.initStorage();\n  try {\n    const storedAuth = await storage.loadAuthCredentials();"
          init_replace = "await storage.initStorage();\n  await restoreRegisteredUsers();\n  try {\n    const storedAuth = await storage.loadAuthCredentials();"
          if init_marker in s and 'await restoreRegisteredUsers();' not in s:
              s = s.replace(init_marker, init_replace, 1)

          s = s.replace("const order = ['H4', 'H1', 'M15', 'M5', 'M1'];", "const order = ['M5', 'M15', 'H1'];")
          s = s.replace("microTimeframe:'M1'", "microTimeframe:'M5'")
          s = s.replace("order: ['H4','H1','M15','M5','M1'],", "order: ['H4','H1','M15','M5'],", 1)
          s = s.replace("M1: 'entry trigger'", "M5: 'entry execution trigger'", 1)

          server.write_text(s,encoding='utf-8')

          login = Path('login.html')
          if login.exists():
              x=login.read_text(encoding='utf-8')
              needle='<a class="link" href="reset-password.html">Forgot password?</a>'
              repl=needle+'<br><a class="link" href="register.html">🆕 Register new member</a>'
              if 'href="register.html"' not in x and needle in x:
                  login.write_text(x.replace(needle,repl,1),encoding='utf-8')

          reg=Path('register.html')
          if not reg.exists():
              reg.write_text(r'''<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V TRADE AI — Register</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#04070d;color:#fff;font:14px Segoe UI,Arial}main{width:min(92%,480px);padding:28px;border:1px solid #233552;border-radius:22px;background:#07101c}h1{margin:0 0 8px}p{color:#8d9bb0}.f{display:grid;gap:7px;margin-top:14px}input,select{height:46px;border-radius:11px;border:1px solid #233552;background:#09111e;color:#fff;padding:0 12px}.btn{width:100%;height:48px;margin-top:18px;border:1px solid #8050ff;border-radius:11px;background:#5421cf;color:#fff;font-weight:800}.link{display:block;margin-top:14px;color:#35d8ff;text-decoration:none}#m{min-height:20px;margin-top:12px}</style></head><body><main><h1>V TRADE AI</h1><p>🆕 Register New Member</p><form id="f"><div class="f"><label>Name</label><input id="n" maxlength="80" required></div><div class="f"><label>Email</label><input id="e" type="email" required></div><div class="f"><label>Password</label><input id="p" type="password" minlength="12" required><small>Password: 12+ chars, upper/lower/number/symbol</small></div><div class="f"><label>Pricing</label><select id="pl"></select></div><button class="btn" id="b">Create Account</button></form><a class="link" href="login.html">← Back to Sign in</a><div id="m"></div></main><script>const A='https://forexai-6xw6.onrender.com',m=document.getElementById('m'),pl=document.getElementById('pl');function show(t,ok=false){m.textContent=t;m.style.color=ok?'#22e58a':'#ff5968'}fetch(A+'/api/public/pricing').then(r=>r.json()).then(d=>{pl.innerHTML=(d.plans||[]).filter(x=>x.enabled!==false).map(x=>`<option value="${x.id}">${x.name} — ${Number(x.price)===0?'Free':x.price+' / '+x.period}</option>`).join('')}).catch(()=>pl.innerHTML='<option value="trial">Free 7-Day Trial</option>');document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const b=document.getElementById('b');b.disabled=true;show('Creating account…');try{const r=await fetch(A+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.value.trim(),email:e.value.trim(),password:p.value,plan:pl.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Registration failed');sessionStorage.setItem('vtrade_auth_token',d.token);sessionStorage.setItem('vtrade_auth',d.token);sessionStorage.setItem('vtrade_user',JSON.stringify(d.user));show('Account created — opening terminal…',true);setTimeout(()=>location.href='premium-dashboard-v5.html',400)}catch(e){show(e.message)}finally{b.disabled=false}}</script></body></html>''',encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "vtrade-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.js login.html register.html
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "feat: production member registration and auth persistence"
          git push
