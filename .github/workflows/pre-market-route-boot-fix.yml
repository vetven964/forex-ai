name: V TRADE Pre-Market Route Boot Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ensure-premarket-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure Pre-Market route is loaded by Render launcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server-launcher.js')
          s = p.read_text(encoding='utf-8')
          marker = 'VTRADE_PREMARKET_ROUTE_BOOT_HOTFIX_V1'
          if marker in s:
              print('Pre-Market launcher hook already present')
              raise SystemExit(0)
          anchor = "require('./server.js');"
          if anchor not in s:
              raise SystemExit('server.js startup anchor not found; refusing unsafe patch')
          hook = """
          // VTRADE_PREMARKET_ROUTE_BOOT_HOTFIX_V1
          // Render uses node server-launcher.js, so the Pre-Market Candle-Open
          // route must be loaded here before server.js is required.
          try {
            require('./pre-market-route-boot-hotfix.js');
            console.log('[V-TRADE LAUNCHER] Pre-Market route boot hook loaded');
          } catch (e) {
            console.error('[V-TRADE LAUNCHER] Pre-Market route boot hook failed:', e.stack || e.message);
            throw e;
          }
          """
          s = s.replace(anchor, hook + "\n" + anchor, 1)
          p.write_text(s, encoding='utf-8')
          print('Patched server-launcher.js')
          PY

      - name: Commit launcher hook
        shell: bash
        run: |
          if git diff --quiet -- server-launcher.js; then
            echo 'No launcher change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server-launcher.js
          git commit -m 'Ensure Pre-Market route loads in Render launcher'
          git push
