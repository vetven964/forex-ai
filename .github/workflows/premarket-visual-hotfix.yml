name: V TRADE AI Pre-Market Visual Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'PREMARKET_VISUAL_FIX_TRIGGER'
      - '.github/workflows/premarket-visual-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Pre-Market card typography and overflow
        shell: python
        run: |
          from pathlib import Path
          css = r'''
/* VTRADE-PREMARKET-VISUAL-FIX-V1 */
#vtradePreMarket .v5-box{min-width:0!important;max-width:100%!important;overflow:hidden!important;box-sizing:border-box!important}
#vtradePreMarket .v5-label{display:block!important;font-size:9px!important;line-height:1.25!important;font-weight:500!important;letter-spacing:.10em!important;text-transform:uppercase!important;white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important;max-width:100%!important;margin:0!important}
#vtradePreMarket .v5-score{font-size:31px!important;line-height:1!important;font-weight:950!important;white-space:nowrap!important}
#vtradePreMarket .v5-row{font-size:11px!important;line-height:1.35!important;min-width:0!important}
#vtradePreMarket .v5-row span,#vtradePreMarket .v5-row b{font-size:11px!important;line-height:1.35!important;min-width:0!important}
#vtradePreMarket .v5-row b{white-space:normal!important;overflow-wrap:anywhere!important}
#vtradePreMarket .v5-note{font-size:10px!important;line-height:1.5!important;overflow-wrap:anywhere!important}
#vtradePreMarket .v5-grid{min-width:0!important}
#vtradePreMarket .v5-grid>.v5-box{min-width:0!important}
@media(max-width:900px){
  #vtradePreMarket .v5-grid{grid-template-columns:1fr!important}
  #vtradePreMarket .v5-label{font-size:9px!important}
  #vtradePreMarket .v5-score{font-size:28px!important}
}
'''
          for name in ('premium-dashboard-live.html','pc-premium-terminal.html','mobile-terminal.html'):
            p=Path(name)
            if not p.exists():
              continue
            s=p.read_text(encoding='utf-8')
            if 'VTRADE-PREMARKET-VISUAL-FIX-V1' not in s:
              pos=s.find('</style>')
              if pos<0:
                raise SystemExit(f'style closing tag not found: {name}')
              s=s[:pos]+css+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
      - name: Commit visual hotfix
        run: |
          rm -f PREMARKET_VISUAL_FIX_TRIGGER
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add premium-dashboard-live.html pc-premium-terminal.html mobile-terminal.html PREMARKET_VISUAL_FIX_TRIGGER .github/workflows/premarket-visual-hotfix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: pre-market card typography overflow'
          git push
