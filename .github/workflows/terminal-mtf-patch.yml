name: Patch Terminal MTF UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch premium terminal MTF workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('premium-dashboard-live.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- VTRADE MTF5 PATCH -->'
          if marker in s:
              print('MTF5 patch already present')
              raise SystemExit(0)

          s = s.replace('.radar{grid-template-columns:repeat(3,1fr)}', '.radar{grid-template-columns:repeat(5,minmax(0,1fr))}')
          s = s.replace('.align{margin-top:12px;', '.candle-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.candle-ai{margin-top:10px}.candle-ai strong{font-size:12px}.tf-action{outline:2px solid #8050ff;outline-offset:-2px}.align{margin-top:12px;')
          s = s.replace('@media(max-width:1250px){.cards{grid-template-columns:repeat(3,1fr)}', '@media(max-width:1250px){.cards{grid-template-columns:repeat(3,1fr)}.candle-grid{grid-template-columns:repeat(2,1fr)}')
          s = s.replace('@media(max-width:900px){.app{display:block}', '@media(max-width:900px){.app{display:block}')
          s = s.replace('@media(max-width:520px){.card{padding:14px}', '@media(max-width:520px){.candle-grid{grid-template-columns:1fr 1fr}.card{padding:14px}')

          status = '<div id="status" class="notice">Connecting to live Backend…</div>'
          candle = '''<!-- VTRADE MTF5 PATCH -->
  <section class="section" id="selectedTfPanel">
    <div class="section-title"><h2><span id="selectedTfTitle">M15</span> Candle + AI Pre-Analysis</h2><span>Open → Close → AI</span></div>
    <div class="grid candle-grid">
      <div class="card"><div class="label">OPEN</div><div class="big" id="tfOpen">—</div></div>
      <div class="card"><div class="label">HIGH</div><div class="big" id="tfHigh">—</div></div>
      <div class="card"><div class="label">LOW</div><div class="big" id="tfLow">—</div></div>
      <div class="card"><div class="label">CLOSE</div><div class="big" id="tfClose">—</div></div>
    </div>
    <div class="notice candle-ai" id="tfAiStatus">Waiting for selected timeframe candle…</div>
  </section>'''
          if status not in s:
              raise SystemExit('status anchor not found')
          s = s.replace(status, status + '\n' + candle, 1)

          old_radar = re.compile(r"function renderRadar\(a\)\{.*?\}\nfunction renderGates", re.S)
          new_radar = '''function getTfCandle(a,tf){const t=a?.timeframes?.[tf]||{};const c=t.candle||t.ohlc||t.latest||t;const bars=t.candles||t.bars||[];const b=Array.isArray(bars)&&bars.length?bars[bars.length-1]:{};return {open:c.open??c.o??b.open??b.o,high:c.high??c.h??b.high??b.h,low:c.low??c.l??b.low??b.l,close:c.close??c.c??b.close??b.c};}
function candleBias(c){const o=Number(c.open),cl=Number(c.close);if(!Number.isFinite(o)||!Number.isFinite(cl)||o===cl)return 'NEUTRAL';return cl>o?'BULLISH':'BEARISH'}
function renderSelectedTf(a,tf){const c=getTfCandle(a,tf);$('selectedTfTitle').textContent=tf+' Candle';$('tfOpen').textContent=fmt(c.open);$('tfHigh').textContent=fmt(c.high);$('tfLow').textContent=fmt(c.low);$('tfClose').textContent=fmt(c.close);const ready=[c.open,c.high,c.low,c.close].every(v=>Number.isFinite(Number(v)));const bias=candleBias(c);const change=Number.isFinite(Number(c.open))&&Number.isFinite(Number(c.close))?Number(c.close)-Number(c.open):null;const ai=a.aiConfirmation?.decision||a.ai?.decision||'WAIT';$('tfAiStatus').className='notice candle-ai '+(ready?'success':'');$('tfAiStatus').innerHTML=ready?`<strong>${tf} OHLC READY</strong> · Candle ${bias} · Open → Close ${change==null?'—':(change>=0?'+':'')+change.toFixed(2)} · AI confirmation: <strong>${ai}</strong>`:`${tf} OHLC not ready — AI pre-analysis is blocked until Open + Close are valid.`}
function renderRadar(a){const all=['M5','M15','H1','H4','D1'];$('radar').innerHTML=all.map(tf=>{const t=a.timeframes?.[tf]||{};const b=badge(t.structure?.bias||t.trend||candleBias(getTfCandle(a,tf)));const sc=t.score??t.directionScore??t.structure?.score??null;const st=t.structure?.state||'Live timeframe structure';return `<div class="card tf ${cls(b)}"><div class="tf-head"><b>${tf}</b><span class="pill ${cls(b)}">${b}</span></div><div class="big ${cls(b)==='bull'?'green':cls(b)==='bear'?'red':'gold'}">${pct(sc)}/100</div><div class="sub">${st}</div><div class="bar"><i style="width:${pct(sc)==='—'?0:pct(sc)}%"></i></div></div>`}).join('');const mb=a.mtf||{};const count=Math.max(Number(mb.coreBull||0),Number(mb.coreBear||0));const side=Number(mb.coreBull||0)>=Number(mb.coreBear||0)?'BULLISH':'BEARISH';$('alignment').textContent=`${count}/3`;$('alignment').className='huge '+(count>=2?'green':'cyan');$('alignbar').style.width=`${Math.min(100,count/3*100)}%`;$('alignText').textContent=`${count}/3 ${count>=2?side:'WAIT'}`}
function renderGates'''
          s2, n = old_radar.subn(new_radar, s, count=1)
          if n != 1:
              raise SystemExit('renderRadar anchor not found')
          s = s2

          s = s.replace("function render(a){const price=", "function render(a){lastAnalysis=a;renderSelectedTf(a,selectedTf);const price=", 1)
          s = s.replace("let API=localStorage.getItem('vtrade_api')||$('api').value;let lang=", "let API=localStorage.getItem('vtrade_api')||$('api').value;let selectedTf=localStorage.getItem('vtrade_selected_tf')||'M15';let lastAnalysis=null;let lang=", 1)
          old_tf = "document.querySelectorAll('.tfs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tfs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');showToast(`${b.textContent} selected`)});"
          new_tf = "document.querySelectorAll('.tfs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tfs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedTf=b.dataset.tf;localStorage.setItem('vtrade_selected_tf',selectedTf);if(lastAnalysis)renderSelectedTf(lastAnalysis,selectedTf);showToast(`${selectedTf} selected · refreshing analysis…`);load()});"
          if old_tf not in s:
              raise SystemExit('timeframe handler not found')
          s = s.replace(old_tf,new_tf,1)
          p.write_text(s,encoding='utf-8')
          print('patched',p)
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- premium-dashboard-live.html; then
            echo "No terminal changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add premium-dashboard-live.html
          git commit -m "feat: complete MTF selected candle workflow"
          git push