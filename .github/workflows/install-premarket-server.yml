name: Install V TRADE pre-market server routes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire server engine
        shell: python
        run: |
          from pathlib import Path
          p=Path('server.js')
          text=p.read_text(encoding='utf-8')
          marker="const app = express();"
          hook="\n// V TRADE AI — Pre-Market + 60m Macro/Truth Social engine\ntry { require('./pre-market-news-engine')(app); } catch (e) { console.error('[PRE-MARKET] install failed:', e.message); }\n"
          if "pre-market-news-engine" not in text:
              if marker not in text:
                  raise SystemExit('server.js app marker not found')
              text=text.replace(marker, marker+hook, 1)
              p.write_text(text,encoding='utf-8')
          else:
              print('Pre-market server hook already installed')
      - name: Commit server hook
        shell: bash
        run: |
          git config user.name "V TRADE AI Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js pre-market-news-engine.js terminal-pre-market.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: wire pre-market macro intelligence server"
          git push
