name: V-TRADE server fs auth hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-server-fs:
    if: ${{ !contains(github.event.head_commit.message, '[auto-fs-hotfix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure server.js has fs module
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'server.js';
          let source = fs.readFileSync(file, 'utf8');
          if (!/^const\s+fs\s*=\s*require\(['"]fs['"]\);/m.test(source)) {
            source = "const fs = require('fs');\n" + source;
            fs.writeFileSync(file, source, 'utf8');
            console.log('[AUTO FS HOTFIX] added fs require to server.js');
          } else {
            console.log('[AUTO FS HOTFIX] server.js already has fs require');
          }
          NODE

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(auth): add fs dependency [auto-fs-hotfix]"
          git push
