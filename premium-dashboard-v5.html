<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050912"><meta http-equiv="Content-Security-Policy" content="default-src 'self';connect-src 'self' https://forexai-6xw6.onrender.com https://api.gdeltproject.org https://translate.googleapis.com;style-src 'self' 'unsafe-inline';script-src 'self' 'unsafe-inline';frame-src 'self';img-src 'self' data: https:;frame-ancestors 'none';base-uri 'self'"><title>V TRADE AI — Secure Premium Terminal V5</title><style>:root{--bg:#04070d;--line:#233552;--text:#f5f8ff;--muted:#8493ab;--v:#6d35e8;--c:#35d8ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 10%,#2b1458 0,transparent 32%),radial-gradient(circle at 85% 10%,#06404a 0,transparent 28%),var(--bg);color:var(--text);font:14px Segoe UI,Arial,sans-serif}#dash{display:none;border:0;width:100%;height:100dvh;height:100svh}#gate{min-height:100dvh;display:grid;place-items:center;padding:18px}.gate-card{width:min(100%,560px);padding:28px;border:1px solid var(--line);border-radius:22px;background:#07101cf7;box-shadow:0 30px 100px #000b;text-align:center}.logo{width:54px;height:54px;margin:auto;border-radius:16px;display:grid;place-items:center;font-size:28px;font-weight:950;background:linear-gradient(135deg,#5120ff,#aa72ff);box-shadow:0 0 30px #693cff66}.gate-card h1{font-size:25px;margin:16px 0 7px}.gate-card p{color:var(--muted);line-height:1.6}.loader{width:34px;height:34px;border:3px solid #233552;border-top-color:#35d8ff;border-radius:50%;margin:20px auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.err{color:#ff9aa5}.links{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}.links a,.langgate{padding:10px 13px;border:1px solid var(--line);border-radius:10px;color:#fff;text-decoration:none;background:#0b1423;cursor:pointer}.links a.primary{background:#5421cf;border-color:#8050ff}.langgate{font-weight:900}.secure-note{margin-top:18px;padding:11px;border:1px solid #147850;border-radius:12px;background:#062d20;color:#a8ffd6;font-size:11px;line-height:1.5}</style></head><body><div id="gate"><div class="gate-card"><div class="logo">V</div><h1 id="gateTitle">V TRADE AI Secure Terminal</h1><p id="gateText">Checking secure account session…</p><div class="loader" id="loader"></div><div id="gateLinks" class="links" style="display:none"><a class="primary" href="login.html" id="gateSignin">Sign in</a><a href="profile.html" id="gateProfile">Profile</a><a href="pricing.html" id="gatePricing">Pricing</a><button class="langgate" id="gateLang">ខ្មែរ</button></div><div class="secure-note">🔐 Server-side authentication · RBAC · signed session · 2FA ready</div></div></div><iframe id="dash" src="premium-dashboard-live.html?v=20260818-logic-mtf-candles-1" title="V TRADE AI Live Terminal"></iframe><script>const API='https://forexai-6xw6.onrender.com',KEY='vtrade_auth_token',LANGKEY='vtrade_lang',f=document.getElementById('dash'),gate=document.getElementById('gate'),gateText=document.getElementById('gateText'),loader=document.getElementById('loader'),gateLinks=document.getElementById('gateLinks');let token=sessionStorage.getItem(KEY)||sessionStorage.getItem('vtrade_auth')||'',lang=localStorage.getItem(LANGKEY)||'en';const D={en:{title:'V TRADE AI Secure Terminal',checking:'Checking secure account session…',signin:'Sign in',profile:'Profile',pricing:'Pricing',lang:'ខ្មែរ',expired:'Your secure session is missing or expired. Please sign in first.',down:'Secure authentication service is unavailable. Please try again.'},km:{title:'V TRADE AI Secure Terminal',checking:'កំពុងពិនិត្យ Session សុវត្ថិភាព…',signin:'ចូលប្រើ',profile:'គណនី',pricing:'តម្លៃគម្រោង',lang:'English',expired:'Session សុវត្ថិភាពបានផុតកំណត់។ សូមចូលប្រើម្ដងទៀត។',down:'សេវា Authentication មិនអាចប្រើបាន។ សូមសាកល្បងម្ដងទៀត។'}};function showLogin(t){gateText.textContent=t;gateText.className='err';loader.style.display='none';gateLinks.style.display='flex'}function applyGate(){document.documentElement.lang=lang;document.getElementById('gateTitle').textContent=D[lang].title;document.getElementById('gateSignin').textContent=D[lang].signin;document.getElementById('gateProfile').textContent=D[lang].profile;document.getElementById('gatePricing').textContent=D[lang].pricing;document.getElementById('gateLang').textContent=D[lang].lang;if(loader.style.display!=='none')gateText.textContent=D[lang].checking}function toggleLang(){lang=lang==='en'?'km':'en';localStorage.setItem(LANGKEY,lang);applyGate();try{applyFrameLang(f.contentDocument)}catch(_){}}async function session(){if(!token)return false;const r=await fetch(API+'/api/auth/session',{headers:{'x-vtrade-auth':token},credentials:'include',cache:'no-store'});return r.ok}function addAccountNav(d){const side=d.getElementById('side');if(!side||d.getElementById('vtradeAccountNav'))return;const nav=side.querySelector('.nav');if(!nav)return;const box=d.createElement('div');box.id='vtradeAccountNav';box.style.cssText='margin-top:8px;padding-top:8px;border-top:1px solid #1d2c44;display:grid;gap:5px';const user=JSON.parse(sessionStorage.getItem('vtrade_user')||'{}');box.innerHTML=`<button id="vProfile" style="border:1px solid transparent;background:transparent;color:#9aa9bf;text-align:left;padding:12px;min-height:45px;border-radius:11px">◉ <span>Profile</span><small style="display:block;color:#8493ab;margin-top:2px">${String(user.name||'Account').replace(/[<>]/g,'')}</small></button><button id="vPricing" style="border:1px solid transparent;background:transparent;color:#9aa9bf;text-align:left;padding:12px;min-height:45px;border-radius:11px">▤ <span>Pricing</span></button>${user.role==='admin'?'<button id="vAdmin" style="border:1px solid transparent;background:transparent;color:#9aa9bf;text-align:left;padding:12px;min-height:45px;border-radius:11px">▣ <span>Admin Dashboard</span></button>':''}<button id="vLang" style="border:1px solid #2c3e5d;background:#0b1423;color:#fff;text-align:left;padding:10px 12px;min-height:42px;border-radius:11px;font-weight:800">🌐 <span>ខ្មែរ</span></button><button id="vtradeLogout" style="border:1px solid #7c2532;background:#2b0c13;color:#ff9aa5;text-align:left;padding:12px;min-height:45px;border-radius:11px">↪ <span>Sign out</span></button>`;nav.appendChild(box);box.querySelector('#vProfile').onclick=()=>location.href='profile.html';box.querySelector('#vPricing').onclick=()=>location.href='pricing.html';if(box.querySelector('#vAdmin'))box.querySelector('#vAdmin').onclick=()=>location.href='admin-dashboard.html';box.querySelector('#vLang').onclick=toggleLang;box.querySelector('#vtradeLogout').onclick=async()=>{try{await fetch(API+'/api/auth/logout',{method:'POST',headers:{'x-vtrade-auth':token},credentials:'include'})}catch{}sessionStorage.clear();location.href='login.html'};applyFrameLang(d)}function applyFrameLang(d){if(!d||!d.body)return;d.documentElement.lang=lang;const nav=d.getElementById('vtradeAccountNav');if(nav){nav.querySelector('#vProfile span').textContent=lang==='km'?'គណនី':'Profile';nav.querySelector('#vPricing span').textContent=lang==='km'?'តម្លៃគម្រោង':'Pricing';const ad=nav.querySelector('#vAdmin span');if(ad)ad.textContent='Admin Dashboard';nav.querySelector('#vLang span').textContent=lang==='km'?'English':'ខ្មែរ';nav.querySelector('#vtradeLogout span').textContent=lang==='km'?'ចាកចេញ':'Sign out'}}function injectSecurity(d){if(d.__vtradeSecureFetch)return;const original=d.defaultView.fetch.bind(d.defaultView);d.defaultView.fetch=async function(input,init={}){const url=typeof input==='string'?input:(input&&input.url)||'';const isApi=String(url).startsWith(API+'/');const opts={...init,credentials:init.credentials||'include',headers:new Headers(init.headers||{})};if(token&&isApi)opts.headers.set('x-vtrade-auth',token);const r=await original(input,opts);if(r.status===401&&isApi){sessionStorage.clear();location.href='login.html'}return r};d.__vtradeSecureFetch=true;addAccountNav(d);const st=d.createElement('style');st.textContent='html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}.main{min-width:0}.wrap{width:auto}@media(max-width:900px){.side{z-index:200}}';d.head.appendChild(st)}function observeFrame(d){if(d.__vtradeObserver)return;const ob=new MutationObserver(()=>{clearTimeout(d.__vtradeLangTimer);d.__vtradeLangTimer=setTimeout(()=>applyFrameLang(d),30)});ob.observe(d.body,{subtree:true,childList:true,characterData:true});d.__vtradeObserver=ob}async function boot(){applyGate();document.getElementById('gateLang').onclick=toggleLang;try{if(!await session())return showLogin(D[lang].expired);gate.style.display='none';f.style.display='block';f.addEventListener('load',()=>{try{injectSecurity(f.contentDocument);observeFrame(f.contentDocument);applyFrameLang(f.contentDocument)}catch(e){console.error(e)}});if(f.contentDocument?.readyState==='complete'){injectSecurity(f.contentDocument);observeFrame(f.contentDocument);applyFrameLang(f.contentDocument)}}catch(e){showLogin(D[lang].down)}}boot();</script></body></html>
