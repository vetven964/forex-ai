<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050912"><title>V TRADE AI — Secure Terminal Router</title><style>html,body{margin:0;min-height:100%;background:#04070d;color:#f5f8ff;font:14px 'Kantumruy Pro','Noto Sans Khmer','Segoe UI',Arial,sans-serif}body{display:grid;place-items:center;min-height:100dvh}.box{width:min(560px,calc(100% - 32px));padding:30px;border:1px solid #233552;border-radius:22px;background:#09111e;text-align:center;box-shadow:0 25px 80px #0009}.logo{width:58px;height:58px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;font-size:30px;font-weight:900;background:linear-gradient(135deg,#5120ff,#aa72ff)}.status{color:#8493ab;line-height:1.6}.spin{width:22px;height:22px;border:3px solid #233552;border-top-color:#9b67ff;border-radius:50%;margin:18px auto;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.btn{display:inline-block;margin:5px;padding:11px 16px;border-radius:11px;border:1px solid #8050ff;background:#5523c9;color:#fff;text-decoration:none;font-weight:800}.btn.secondary{background:#0b1423;border-color:#233552}.hint{margin-top:14px;color:#64738a;font-size:10px}</style><script src="vtrade-connection.js?v=20260818-router"></script>  <script src="vtrade-connection.js"></script>
  <script src="terminal-pre-market.js"></script>
</head><body><div class="box"><div class="logo">V</div><h2>V TRADE AI</h2><div id="status" class="status">Checking secure session and backend connection…</div><div id="spin" class="spin"></div><div id="actions" style="display:none"><a class="btn" href="connection.html">Connection Center</a><a class="btn secondary" href="login.html">Sign in</a><a class="btn secondary" href="index.html">Home</a></div><div class="hint">Single backend: forexai-6xw6.onrender.com</div></div><script>(async()=>{const status=document.getElementById('status'),spin=document.getElementById('spin'),actions=document.getElementById('actions');const token=window.VTRADE_CONNECTION?.token?.()||sessionStorage.getItem('vtrade_auth_token')||sessionStorage.getItem('vtrade_auth');if(!token){status.textContent='No active session. Opening the new Connection Center…';spin.style.display='none';location.replace('connection.html');return}try{const r=await window.VTRADE_CONNECTION.fetch('/api/auth/session');if(!r.ok)throw Error('SESSION_'+r.status);const data=await r.json().catch(()=>({}));const user=data.user||data.account||{};const role=String(user.role||data.role||'user').toLowerCase();sessionStorage.setItem('vtrade_user',JSON.stringify(user));if(role==='admin'){status.textContent='Administrator verified. Opening Admin Command Center…';location.replace('admin-dashboard.html')}else{status.textContent='User session verified. Opening Premium Terminal…';location.replace('premium-dashboard-live.html?v=20260818-single-connection')}}catch(e){window.VTRADE_CONNECTION?.clearSession?.();sessionStorage.removeItem('vtrade_auth_token');sessionStorage.removeItem('vtrade_auth');sessionStorage.removeItem('vtrade_user');status.textContent='Session expired. Use Connection Center or sign in again.';spin.style.display='none';actions.style.display='block'}})();</script></body></html>
