<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V TRADE AI — Premium Terminal V5 Live</title><style>html,body{margin:0;background:#04070d;color:#fff;font:14px Segoe UI,Arial,sans-serif}#dash{border:0;width:100%;height:100dvh;display:block}</style></head><body><iframe id="dash" src="premium-dashboard-live.html?v=5"></iframe><script>
const f=document.getElementById('dash'),API='https://forexai-6xw6.onrender.com';let latest=null;
function badge(x){const b=String(x?.structure?.bias||x?.bias||x?.direction||x?.trend||'NEUTRAL').toUpperCase();return b.includes('BULL')?'BULLISH':b.includes('BEAR')?'BEARISH':'NEUTRAL'}
function score(x,b){for(const n of [x?.structure?.score,x?.structure?.directionScore,x?.score,x?.confidence,x?.confluence])if(Number.isFinite(+n))return Math.round(Math.max(0,Math.min(100,+n)));return b==='NEUTRAL'?50:Math.max(50,Math.min(100,+x?.structure?.strength||+x?.strength||50))}
function apply(){const d=f.contentDocument;if(!d||!latest)return;const $=id=>d.getElementById(id);const a=latest,m=a.mtf||{},core=Array.isArray(m.coreTimeframes)&&m.coreTimeframes.length?m.coreTimeframes:['H4','H1','M15'],t=a.timeframes||{},count=Number.isFinite(+m.mtfCount)?+m.mtfCount:0,required=Number.isFinite(+m.requiredAlignment)?+m.requiredAlignment:2;
if($('coreLabel'))$('coreLabel').textContent='Core: '+core.join(' / ');if($('radarHead'))$('radarHead').textContent='CORE MTF · '+required+'/'+core.length+' REQUIRED';if($('alignment'))$('alignment').textContent=count+'/'+core.length;if($('required'))$('required').textContent=required+' / '+core.length;if($('alignbar'))$('alignbar').style.width=Math.max(0,Math.min(100,count/core.length*100))+'%';if($('alignText'))$('alignText').textContent=count+'/'+core.length+' '+(a.decision?.state||'WAIT');
const r=$('radar');if(r)r.innerHTML=core.map(k=>{const x=t[k]||{},b=badge(x),s=score(x,b),c=b==='BULLISH'?'bull':b==='BEARISH'?'bear':'neutral',cl=b==='BULLISH'?'green':b==='BEARISH'?'red':'gold';return `<div class="card tf ${c}"><div class="tf-head"><b>${k}</b><span class="pill ${c}">${b}</span></div><div class="huge ${cl}">${s}/100</div><div class="sub">Live timeframe structure</div><div class="bar"><i style="width:${s}%"></i></div></div>`}).join('');
if($('ai'))$('ai').textContent=a.aiConfirmation?.confirmed?'CONFIRMED':a.aiConfirmation?'REVIEW':'WAIT';if($('aiSub'))$('aiSub').textContent=a.aiConfirmation?.reason||'Backend AI confirmation';if($('aiConf'))$('aiConf').textContent=(Number.isFinite(+(a.aiConfirmation?.score??a.aiConfirmation?.confidence))?Math.round(+(a.aiConfirmation?.score??a.aiConfirmation?.confidence)):0)+'/100';
}
async function refresh(){try{const r=await fetch(API+'/api/analysis/xauusd',{cache:'no-store'});if(r.ok){const a=await r.json();if(a.success)latest=a}}catch(e){}}
f.addEventListener('load',()=>{refresh();setInterval(refresh,5000);setInterval(apply,250);setTimeout(apply,300)});
</script></body></html>
