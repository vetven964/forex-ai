const iframe=document.getElementById('dash');let original=[];let current='km';
function inject(){const d=iframe.contentDocument;if(!d||!d.body)return;const style=d.createElement('style');style.textContent=`.vtrade-lang{display:flex;align-items:center;gap:6px;position:absolute;right:18px;top:13px;z-index:50;background:#09111eea;border:1px solid #263650;border-radius:10px;padding:5px 6px;box-shadow:0 8px 24px #0008}.vtrade-lang span{font:10px Segoe UI,Arial;color:#9aa9bf}.vtrade-lang select{background:#0b1423;color:#fff;border:1px solid #394b68;border-radius:7px;padding:6px 8px;font:11px Segoe UI,Arial;cursor:pointer;max-width:130px}.top{position:sticky!important;z-index:20!important;padding-right:165px!important}.tfs{margin-right:0!important}@media(max-width:1150px){.vtrade-lang{right:14px}.top{padding-right:155px!important}}@media(max-width:760px){.vtrade-lang{position:relative;right:auto;top:auto;width:100%;justify-content:space-between;margin:6px 0 0;padding:6px 8px;order:20}.vtrade-lang span{font-size:10px}.vtrade-lang select{flex:1;max-width:none;min-height:34px}.top{padding-right:13px!important;padding-bottom:10px!important}.tfs{order:10}.vtrade-lang{order:11}}`;d.head.appendChild(style);const top=d.querySelector('.top');if(!top)return;let box=top.querySelector('.vtrade-lang');if(!box){box=d.createElement('div');box.className='vtrade-lang';box.innerHTML='<span>🌐 Language</span><select aria-label="Language"></select>';top.appendChild(box)}const sel=box.querySelector('select');sel.innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');sel.value=current;sel.onchange=()=>{current=sel.value;localStorage.setItem('vtrade-language',current);apply(current)};original=[];walk(d.body);apply(current)}
function walk(n){if(n.nodeType===3){original.push([n,n.nodeValue]);return}for(const c of n.childNodes)walk(c)}
function apply(code){const map=(LANGS[code]||LANGS.en).map||{};for(const [n,v] of original){let x=v;const t=v.trim();if(map[t])x=v.replace(t,map[t]);n.nodeValue=x}try{iframe.contentDocument.documentElement.lang=code}catch(e){}}
iframe.addEventListener('load',()=>{current=localStorage.getItem('vtrade-language')||'km';setTimeout(inject,30)});window.addEventListener('resize',()=>{});
