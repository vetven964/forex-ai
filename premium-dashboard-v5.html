if($('ai'))$('ai').textContent=a.aiConfirmation?.confirmed?'CONFIRMED':a.aiConfirmation?'REVIEW':'WAIT';if($('aiSub'))$('aiSub').textContent=a.aiConfirmation?.reason||'Backend AI confirmation';if($('aiConf'))$('aiConf').textContent=(Number.isFinite(+(a.aiConfirmation?.score??a.aiConfirmation?.confidence))?Math.round(+(a.aiConfirmation?.score??a.aiConfirmation?.confidence)):0)+'/100';
if($('status')&&a.brokerConnected)$('status').textContent=`Live Backend connected · VT Markets MT5 · ${a.priceAgeSec??'—'}s quote age`;
}
