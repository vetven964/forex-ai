<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050912"><title>V TRADE AI — Premium Terminal V5 Live</title><style>html,body{margin:0;background:#04070d;color:#fff;font:14px Segoe UI,Arial,sans-serif;overflow:hidden}#dash{border:0;width:100%;height:100dvh;display:block}@supports(height:100svh){#dash{height:100svh}}@media(max-width:700px){#dash{height:100dvh}}</style></head><body><iframe id="dash" src="premium-dashboard-live.html?v=20260817-responsive-mtf" title="V TRADE AI Live"></iframe><script>
const f=document.getElementById('dash'),API='https://forexai-6xw6.onrender.com',CORE=['H4','H1','M15'];let latest=null,styleInjected=false;
function badge(x){const b=String(x?.structure?.bias||x?.bias||x?.direction||x?.trend||'NEUTRAL').toUpperCase();return b.includes('BULL')?'BULLISH':b.includes('BEAR')?'BEARISH':'NEUTRAL'}
function score(x,b){for(const n of [x?.structure?.score,x?.structure?.directionScore,x?.score,x?.confidence,x?.confluence])if(Number.isFinite(+n))return Math.round(Math.max(0,Math.min(100,+n)));return b==='NEUTRAL'?50:Math.max(50,Math.min(100,+x?.structure?.strength||+x?.strength||50))}
function mobilePolish(d){if(styleInjected||!d.head)return;const s=d.createElement('style');s.id='vtrade-responsive-polish';s.textContent=`html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}.main{min-width:0}.wrap{width:auto}.card{min-width:0}.api{min-width:0}@media(max-width:900px){.top{z-index:100}.side{z-index:200}.wrap{padding-bottom:34px}.cards,.radar,.gategrid,.mainrow{grid-template-columns:1fr!important}.cards{gap:10px}.card{border-radius:14px}.radar .card{padding:14px}.gate{min-height:58px}.mainrow{gap:10px}.chart{height:210px!important}.toolbar{gap:8px}.api{font-size:12px}.btn{white-space:nowrap}.tfs{max-width:100%;padding-bottom:2px}.tfs button{min-width:46px}.price{font-size:27px!important}.pair{min-width:0}.backend{white-space:nowrap}.signal-state{font-size:28px!important}}@media(max-width:520px){.wrap{padding:8px!important}.top{gap:5px!important}.pair b{font-size:13px}.pair .sub{font-size:9px}.price{font-size:24px!important}.live{font-size:9px}.backend{font-size:8px!important;padding:5px 7px!important}.tfs{gap:4px!important}.tfs button{padding:8px 10px!important;min-height:40px!important}.toolbar{grid-template-columns:1fr!important}.toolbar .btn{width:100%}.huge{font-size:30px!important}.section-title h2{font-size:16px!important}.gate{padding:11px!important}.level{font-size:11px!important}.level b{font-size:11px!important}.notice{font-size:12px!important}.side{width:280px!important}}`;d.head.appendChild(s);styleInjected=true}
function patchText(d){[...d.querySelectorAll('*')].forEach(el=>{if(el.children.length===0){el.textContent=el.textContent.replaceAll('Core: H1 / M15 / M5','Core: H4 / H1 / M15').replaceAll('H1/M15/M5','H4/H1/M15').replaceAll('H1 / M15 / M5','H4 / H1 / M15')}})}
function apply(){const d=f.contentDocument;if(!d||!latest)return;mobilePolish(d);const $=id=>d.getElementById(id),a=latest,m=a.mtf||{},t=a.timeframes||{},count=Number.isFinite(+m.mtfCount)?+m.mtfCount:Math.max(+m.coreBull||0,+m.coreBear||0),required=Number.isFinite(+m.requiredAlignment)?+m.requiredAlignment:2;patchText(d);
const r=$('radar');if(r)r.innerHTML=CORE.map(k=>{const x=t[k]||{},b=badge(x),s=score(x,b),c=b==='BULLISH'?'bull':b==='BEARISH'?'bear':'neutral',cl=b==='BULLISH'?'green':b==='BEARISH'?'red':'gold';return `<div class="card tf ${c}"><div class="tf-head"><b>${k}</b><span class="pill ${c}">${b}</span></div><div class="huge ${cl}">${s}/100</div><div class="sub">Live timeframe structure</div><div class="bar"><i style="width:${s}%"></i></div></div>`}).join('');
const alignment=$('alignment');if(alignment){alignment.textContent=Math.max(0,Math.min(3,count))+'/3';alignment.className='huge '+(count>=required?'green':'cyan');const card=alignment.closest('.card');if(card){const sub=card.querySelector('.sub');if(sub)sub.textContent='Core: H4 / H1 / M15';const req=card.querySelector('.kv b');if(req)req.textContent=required+' / 3'}}
const bar=$('alignbar');if(bar)bar.style.width=Math.max(0,Math.min(100,count/3*100))+'%';const txt=$('alignText');if(txt)txt.textContent=count+'/3 '+(a.decision?.state||a.signal||'WAIT');
[...d.querySelectorAll('.section-title span')].forEach(s=>{if(s.textContent.includes('LIVE ENGINE DATA'))s.textContent='CORE MTF · '+required+'/3 REQUIRED'});
const why=$('reasons');if(why)why.innerHTML=why.innerHTML.replaceAll('H1/M15/M5','H4/H1/M15').replaceAll('H1 / M15 / M5','H4 / H1 / M15');
}
async function refresh(){try{const r=await fetch(API+'/api/analysis/xauusd',{cache:'no-store'});if(r.ok){const a=await r.json();if(a.success)latest=a}}catch(e){}}
f.addEventListener('load',()=>{refresh();setInterval(refresh,5000);setInterval(apply,250);setTimeout(apply,500)});
</script></body></html>
