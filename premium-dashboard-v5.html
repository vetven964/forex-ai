<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050912">
<title>V TRADE AI — Private Terminal</title>
<style>
html,body{margin:0;min-height:100%;background:#04070d;color:#f5f8ff;font:14px Segoe UI,Arial,sans-serif}body{display:grid;place-items:center;min-height:100dvh}.box{width:min(520px,calc(100% - 32px));padding:28px;border:1px solid #233552;border-radius:20px;background:#09111e;text-align:center;box-shadow:0 25px 80px #0009}.logo{width:58px;height:58px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;font-size:30px;font-weight:900;background:linear-gradient(135deg,#5120ff,#aa72ff)}.status{color:#8493ab;line-height:1.6}.spin{width:22px;height:22px;border:3px solid #233552;border-top-color:#9b67ff;border-radius:50%;margin:18px auto;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.btn{display:inline-block;margin-top:10px;padding:11px 16px;border-radius:11px;border:1px solid #8050ff;background:#5523c9;color:#fff;text-decoration:none;font-weight:800}
</style>
<script src="vtrade-connection.js"></script>
</head>
<body>
<div class="box">
  <div class="logo">V</div>
  <h2>V TRADE AI</h2>
  <div id="status" class="status">Checking secure session…</div>
  <div id="spin" class="spin"></div>
  <a id="login" class="btn" href="login.html" style="display:none">Sign in</a>
</div>
<script>
(async()=>{
  const status=document.getElementById('status'),spin=document.getElementById('spin'),login=document.getElementById('login');
  const token=VTRADE_CONNECTION.token();
  if(!token){status.textContent='Secure login required before entering the private terminal.';spin.style.display='none';login.style.display='inline-block';return;}
  try{
    const r=await VTRADE_CONNECTION.fetch('/api/auth/session');
    if(!r.ok) throw new Error('SESSION_'+r.status);
    const data=await r.json().catch(()=>({}));
    const user=data.user||data.account||null;
    if(user) sessionStorage.setItem('vtrade_user',JSON.stringify(user));
    location.replace('premium-dashboard-live.html?v=20260818-single-connection');
  }catch(e){
    VTRADE_CONNECTION.clearSession();
    status.textContent='Session expired or not authorized. Please sign in again.';
    spin.style.display='none';login.style.display='inline-block';
  }
})();
</script>
</body>
</html>
