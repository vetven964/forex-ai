    <!-- JavaScript Execution Logic -->
    <script>
        let tvWidgetInstance = null;
        let activeOtpCode = "889922";

        const translations = {
            km: {
                brand: "V TRADE AI & BOT",
                headerStatus: "Admin & 2FA Active",
                deposit: "បង់ប្រាក់",
                auth: "Login",
                dash: "ផ្ទាំងគ្រប់គ្រង (Dashboard)",
                sessions: "ម៉ោងទីផ្សារ (Asian/NY/London)",
                news: "ព័ត៌មាន & តំណភ្ជាប់ (News Links)",
                pricing: "កញ្ចប់តម្លៃថ្មី (Pricing)",
                telegram: "Telegram Bot & Setup",
                signals: "AI Research & Signals",
                chart: "TradingView Chart",
                security: "សុវត្ថិភាព & 2FA",
                support: "AI Support 24/7"
            },
            en: {
                brand: "V TRADE AI & BOT",
                headerStatus: "Admin & 2FA Active",
                deposit: "Pay Money",
                auth: "Login",
                dash: "Dashboard",
                sessions: "Market Sessions",
                news: "News & Links",
                pricing: "Pricing Plans",
                telegram: "Telegram Bot Setup",
                signals: "AI Signals",
                chart: "TradingView",
                security: "Security & 2FA",
                support: "AI Support"
            },
            zh: {
                brand: "V TRADE AI",
                headerStatus: "管理员与2FA激活",
                deposit: "支付",
                auth: "登录",
                dash: "控制面板",
                sessions: "市场时段",
                news: "新闻与链接",
                pricing: "价格方案",
                telegram: "电报设置",
                signals: "AI信号",
                chart: "图表",
                security: "安全",
                support: "支持"
            }
        };

        function changeLanguage(lang) {
            const t = translations[lang] || translations.km;
            document.getElementById('txtBrandTitle').innerText = t.brand;
            document.getElementById('txtHeaderStatus').innerText = t.headerStatus;
            document.getElementById('btnDeposit').innerText = t.deposit;
            document.getElementById('btnAuth').innerText = t.auth;
            document.getElementById('menuDashboard').innerText = t.dash;
            document.getElementById('menuSessions').innerText = t.sessions;
            document.getElementById('menuNews').innerText = t.news;
            document.getElementById('menuPricing').innerText = t.pricing;
            document.getElementById('menuTelegram').innerText = t.telegram;
            document.getElementById('menuSignals').innerText = t.signals;
            document.getElementById('menuChart').innerText = t.chart;
            document.getElementById('menuSecurity').innerText = t.security;
            document.getElementById('menuSupport').innerText = t.support;
        }

        function toggleMobileMenu() {
            const overlay = document.getElementById('mobileMenuOverlay');
            overlay.classList.toggle('hidden');
        }

        function updateRealTimeData() {
            const now = new Date();
            const options = { year: 'numeric', month: '2-digit', day: '2-digit' };
            document.getElementById('liveDate').innerText = now.toLocaleDateString('km-KH', options);
            document.getElementById('liveClock').innerText = now.toLocaleTimeString('en-US', { hour12: false });

            const hours = now.getHours();
            const minutes = now.getMinutes();
            const totalMinutes = hours * 60 + minutes;

            const isAsianOpen = totalMinutes >= 420 && totalMinutes < 900;
            updateSessionUI('Asian', isAsianOpen, 'badgeAsian', 'timerAsian', 'dashAsianStatus');

            const isLondonOpen = totalMinutes >= 900 && totalMinutes < 1380;
            updateSessionUI('London', isLondonOpen, 'badgeLondon', 'timerLondon', 'dashLondonStatus');

            const isNyOpen = totalMinutes >= 1200 || totalMinutes < 240;
            updateSessionUI('New York', isNyOpen, 'badgeNy', 'timerNy', 'dashNyStatus');
        }

        function updateSessionUI(name, isOpen, badgeId, timerId, dashStatusId) {
            const badge = document.getElementById(badgeId);
            const timer = document.getElementById(timerId);
            const dashStatus = document.getElementById(dashStatusId);

            if(isOpen) {
                badge.className = "px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 animate-pulse";
                badge.innerText = "🟢 OPEN (បើក)";
                if(timer) timer.innerText = `ស្ថានភាព៖ ទីផ្សារ ${name} កំពុងដំណើរការ active`;
                if(dashStatus) dashStatus.innerText = "🟢 OPEN (កំពុងបើក)";
            } else {
                badge.className = "px-2.5 py-1 rounded-full text-[10px] font-bold bg-gray-800 text-gray-400";
                badge.innerText = "🔴 CLOSED (បិទ)";
                if(timer) timer.innerText = `ស្ថានភាព៖ ទីផ្សារ ${name} បានបិទរង់ចាំបើកពេលក្រោយ`;
                if(dashStatus) dashStatus.innerText = "🔴 CLOSED (បានបិទ)";
            }
        }

        // ការពិនិត្យស្ថានភាព Login ពេលទំព័រត្រូវបាន Load ឡើងវិញ (Prevent Refresh Logout)
        window.onload = function() {
            updateRealTimeData();
            
            // ឆែកមើល localStorage ថាតើធ្លាប់ Login រួចរាល់ហើយឬยัง
            const savedUser = localStorage.getItem('vtrade_logged_user');
            if(savedUser) {
                document.getElementById('btnAuth').innerText = savedUser;
                console.log("Session restored for user:", savedUser);
            }
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('aside nav button').forEach(btn => {
                if(!btn.id.includes('admin')) {
                    btn.className = "w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition text-xs text-left";
                }
            });
            
            const targetTab = document.getElementById('tab-' + tabId);
            const targetNav = document.getElementById('nav-' + tabId);
            
            if(targetTab) targetTab.classList.add('active');
            if(targetNav) {
                if(tabId === 'admin') {
                    targetNav.className = "w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-amber-500/20 text-amber-400 font-medium transition text-xs text-left border border-amber-500/40";
                } else {
                    targetNav.className = "w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-blue-600/20 text-blue-400 font-medium transition text-xs text-left";
                }
            }

            if(tabId === 'tvchart' && !tvWidgetInstance) {
                initTradingViewWidget('BINANCE:BTCUSDT');
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function selectPricingPlan(planName, price) {
            document.getElementById('selectedPlanInput').value = planName;
            document.getElementById('currentPlanDisplay').innerText = planName;
            alert(`បានជ្រើសរើសកញ្ចប់ ${planName} ($${price})។ សូមធ្វើការបង់ប្រាក់តាមលេខគណនី VET VEN ឬភ្ជាប់ Telegram Bot!`);
            switchTab('telegram');
        }

        function updateUserLevel(username, level) {
            alert(`បានប្តូរកម្រិតសិទ្ធិរបស់ ${username} ទៅជា "${level}" ដោយជោគជ័យ!`);
        }

        function initTradingViewWidget(symbol) {
            document.getElementById('tradingview_widget').innerHTML = "";
            tvWidgetInstance = new TradingView.widget({
                "width": "100%", "height": "450", "symbol": symbol, "interval": "D",
                "timezone": "Asia/Phnom_Penh", "theme": "dark", "style": "1", "locale": "en",
                "toolbar_bg": "#07090e", "container_id": "tradingview_widget"
            });
        }

        function changeTradingViewSymbol(symbol) { initTradingViewWidget(symbol); }

        function proceedTo2FAStep() {
            activeOtpCode = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('generatedOtpDisplay').innerText = activeOtpCode;
            document.getElementById('loginFormSection').classList.add('hidden');
            document.getElementById('otpVerificationSection').classList.remove('hidden');
            document.getElementById('authModalTitle').innerText = '2FA OTP Verification Required';
        }

        function verifyOtpAndLogin() {
            const userEnteredOtp = document.getElementById('otpInputCode').value.trim();
            const email = document.getElementById('authEmail').value;
            
            if(userEnteredOtp === activeOtpCode) {
                closeModal('authModal');
                
                // កាត់យកឈ្មោះពី Email មកបង្ហាញ និងរក្សាទុកក្នុង localStorage
                const shortName = email ? email.split('@')[0] : 'Admin Secured';
                localStorage.setItem('vtrade_logged_user', shortName);
                
                document.getElementById('btnAuth').innerText = shortName;
                alert('ផ្ទៀងផ្ទាត់ 2FA OTP ជោគជ័យ! បានចូលប្រព័ន្ធដោយសុវត្ថិភាព ១០០%។');
            } else {
                alert('លេខកូដ OTP មិនត្រឹមត្រូវទេ! (កូដគឺ៖ ' + activeOtpCode + ')');
            }
        }

        function runAIResearchScan() {
            alert('AI Research បានវិភាគទីផ្សាររួចរាល់ និងត្រៀមផ្ញើសញ្ញាទៅកាន់ Telegram Bot!');
        }

        async function sendSignalToTelegram(pair, actionDesc) {
            const token = document.getElementById('tgTokenInput').value.trim();
            const chatId = document.getElementById('tgChatIdInput').value.trim();
            const plan = document.getElementById('selectedPlanInput').value;
            const userName = document.getElementById('tgUserName').value;

            if(!token || !chatId) {
                alert('សូមបំពេញ Telegram Bot Token និង Chat ID នៅផ្ទាំង "Telegram Bot & Setup" ជាមុនសិន!');
                switchTab('telegram');
                return;
            }

            const text = `🤖 **V TRADE AI RESEARCH SIGNAL**\n📦 Plan: ${plan}\n🪙 Pair: ${pair}\n⚡ Signal: *${actionDesc}*\n👤 User: ${userName}\n🛡️ Security: Verified 100%`;
            
            try {
                const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'Markdown' })
                });
                const d = await res.json();
                if(d.ok) alert('សញ្ញា Trade ត្រូវបានផ្ញើចូល Telegram ដោយជោគជ័យ!');
                else alert('ផ្ញើមិនចេញទេ៖ ' + d.description);
            } catch(e) {
                alert('កំហុសតភ្ជាប់បណ្តាញ API Telegram!');
            }
        }

        async function testTelegramIntegration() {
            const token = document.getElementById('tgTokenInput').value.trim();
            const chatId = document.getElementById('tgChatIdInput').value.trim();
            if(!token || !chatId) {
                alert('សូមបំពេញ Bot Token និង Chat ID ឱ្យបានត្រឹមត្រូវសិន!');
                return;
            }
            const text = `🔔 **V Trade AI Connection Test**\n✅ Telegram Bot connected successfully!`;
            try {
                const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'Markdown' })
                });
                const d = await res.json();
                if(d.ok) alert('តេស្តតភ្ជាប់ Telegram Bot បានជោគជ័យ ១០០%!');
                else alert('បញ្ហា៖ ' + d.description);
            } catch(err) {
                alert('កំហុសតភ្ជាប់បណ្តាញ!');
            }
        }

        function sendChat() {
            const input = document.getElementById('chatInput');
            const box = document.getElementById('chatMsgBox');
            if(!input.value.trim()) return;
            box.innerHTML += `<div class="bg-blue-600 p-2 rounded-xl text-white ml-auto max-w-[80%]">${input.value}</div>`;
            input.value = '';
            setTimeout(() => {
                box.innerHTML += `<div class="bg-gray-800 p-2 rounded-xl text-gray-200 max-w-[80%]">AI Support: ប្រព័ន្ធ Admin Manager និងមុខងារទាំងអស់ដំណើរការធម្មតា ១០០%។</div>`;
                box.scrollTop = box.scrollHeight;
            }, 500);
        }
    </script>
