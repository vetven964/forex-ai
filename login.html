<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050912"><meta http-equiv="Content-Security-Policy" content="default-src 'self';connect-src 'self' https://forexai-6xw6.onrender.com;style-src 'self' 'unsafe-inline';script-src 'self' 'unsafe-inline';img-src 'self' data: https:;frame-ancestors 'none';base-uri 'self';form-action 'self'"><title>V TRADE AI — Secure Sign In</title><style>:root{--bg:#04070d;--line:#233552;--text:#f5f8ff;--muted:#8d9bb0;--v:#7136e8;--g:#22e58a;--r:#ff5968;--c:#35d8ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 10% 0,#281450,transparent 32%),radial-gradient(circle at 90% 5%,#073c43,transparent 30%),var(--bg);color:var(--text);font:14px 'Kantumruy Pro','Noto Sans Khmer','Segoe UI',Arial,sans-serif}body{display:grid;place-items:center;padding:12px}.box{width:min(440px,100%);padding:28px;border:1px solid var(--line);border-radius:24px;background:#07101cf5;box-shadow:0 30px 90px #000b}.logo{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;font-size:28px;font-weight:950;background:linear-gradient(135deg,#5120ff,#aa72ff);margin-bottom:18px}.muted{color:var(--muted);line-height:1.6}.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.roles button,.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:#09111e;color:#fff;font-weight:800}.roles .active{background:#28105e;border-color:#8050ff}.field{display:grid;gap:7px;margin:14px 0}.field input{height:48px;border:1px solid var(--line);border-radius:12px;background:#09111e;color:#fff;padding:0 13px;outline:none}.btn{width:100%;background:linear-gradient(135deg,#5421cf,#7136e8);border-color:#8050ff;cursor:pointer}.btn:disabled{opacity:.6}.msg{min-height:22px;margin-top:13px;color:var(--r);font-size:12px}.backend{margin-top:12px;padding:9px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:11px}.ok{border-color:#147850;background:#062d20;color:#9fffd0}.bad{border-color:#7c2532;background:#2b0c13;color:#ff9aa6}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:12px}.links a{color:var(--c);text-decoration:none}@media(max-width:520px){.box{padding:22px;border-radius:18px}}</style><script src="vtrade-connection.js?v=20260819-login3"></script><script src="terminal-pre-market.js"></script><script src="vtrade-rbac-guard.js"></script>  <script src="vtrade-connection.js"></script>
</head><body><main class="box"><div class="logo">V</div><h1>V TRADE AI</h1><div class="muted">Secure ICT Smart Terminal access. Server verifies the real account role.</div><div class="roles"><button id="userMode" class="active">👤 User</button><button id="adminMode">👑 Admin</button></div><form id="form"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="submit">🔐 Sign in as User</button></form><div id="twofa" hidden><div class="field"><label>2FA code</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><button class="btn" id="verify">Verify & Continue</button></div><div id="msg" class="msg"></div><div id="backend" class="backend">Checking Render backend…</div><div class="links"><a href="index.html">← Home</a><a href="register.html">Create account</a><a href="reset-password.html">Forgot password?</a></div></main><script>const API=window.VTRADE_CONNECTION?.backend||'https://forexai-6xw6.onrender.com',$=x=>document.getElementById(x);let role='user',challenge='';function setRole(r){role=r;$('userMode').classList.toggle('active',r==='user');$('adminMode').classList.toggle('active',r==='admin');$('submit').textContent=r==='admin'?'👑 Sign in as Admin':'🔐 Sign in as User'}function say(t,ok=false){$('msg').textContent=t;$('msg').style.color=ok?'#22e58a':'#ff5968'}async function req(path,opt={}){const f=window.VTRADE_CONNECTION?.fetch||fetch;const r=await f(API+path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})},credentials:'omit',cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}function save(j){if(!j?.token)throw Error('Authentication token was not returned');const t=String(j.token),u=j.user||{};for(const s of [localStorage,sessionStorage]){s.setItem('vtrade_auth_token',t);s.setItem('vtrade_auth',t);s.setItem('vtrade_user',JSON.stringify(u))}localStorage.setItem('vtrade_lang',localStorage.getItem('vtrade_lang')==='km'?'km':'en');const r=String(u.role||j.role||'user').toLowerCase();location.replace((r==='admin'||r==='administrator')?'admin-dashboard.html?v=20260819-login3':'premium-dashboard-live.html?v=20260819-login3')}async function login(e){e.preventDefault();$('submit').disabled=true;say('Signing in…');try{const j=await req('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});if(j.requires2FA){challenge=j.challenge;$('form').hidden=true;$('twofa').hidden=false;say('2FA challenge created.',true);return}const r=String(j.user?.role||j.role||'user').toLowerCase();if(role==='admin'&&!['admin','administrator'].includes(r))throw Error('This account is not an administrator.');if(role==='user'&&['admin','administrator'].includes(r))throw Error('Admin account detected. Please choose Admin.');save(j)}catch(e){say(e.message)}finally{$('submit').disabled=false}}$('userMode').onclick=()=>setRole('user');$('adminMode').onclick=()=>setRole('admin');$('form').onsubmit=login;$('verify').onclick=async()=>{try{const j=await req('/api/auth/2fa/verify',{method:'POST',body:JSON.stringify({challenge,code:$('code').value.trim()})});save(j)}catch(e){say(e.message)}};(async()=>{try{const r=await fetch(API+'/api/health',{cache:'no-store'});if(!r.ok)throw Error(r.status);$('backend').textContent='● Render backend connected';$('backend').classList.add('ok')}catch(e){$('backend').textContent='● Render backend unavailable';$('backend').classList.add('bad')}})();</script></body></html>
