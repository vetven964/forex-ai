<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V TRADE AI — Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 10% 0,#281450,transparent 32%),radial-gradient(circle at 90% 5%,#073c43,transparent 30%),#04070d;color:#f5f8ff;font:14px 'Kantumruy Pro','Noto Sans Khmer','Segoe UI',Arial,sans-serif}.box{width:min(440px,100%);padding:28px;border:1px solid #233552;border-radius:24px;background:#07101cf5;box-shadow:0 30px 90px #000b}.logo{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;font-size:28px;font-weight:950;background:linear-gradient(135deg,#5120ff,#aa72ff);margin-bottom:18px}.muted{color:#8d9bb0;line-height:1.6}.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.roles button,.btn{min-height:48px;border-radius:12px;border:1px solid #233552;background:#09111e;color:#fff;font-weight:800}.roles .active{background:#28105e;border-color:#8050ff}.field{display:grid;gap:7px;margin:14px 0}.field input{height:48px;border:1px solid #2b3e60;border-radius:12px;background:#eef3ff;color:#101522;padding:0 13px;outline:none;width:100%}.btn{width:100%;background:linear-gradient(135deg,#5421cf,#7136e8);border-color:#8050ff;cursor:pointer}.btn:disabled{opacity:.6}.msg{min-height:22px;margin-top:13px;color:#ff5968;font-size:12px}.backend{margin-top:12px;padding:9px;border:1px solid #233552;border-radius:10px;color:#8d9bb0;font-size:11px}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:12px}.links a{color:#35d8ff;text-decoration:none}</style><script src="site-connection.js?v=20260821-auth-clean"></script><script src="vtrade-connection.js"></script><script src="vtrade-rbac-guard.js"></script><link rel="stylesheet" href="vtrade-responsive.css?v=20260821-fluid"><script defer src="vtrade-responsive.js?v=20260821-fluid"></script></head><body><main class="box"><div class="logo">V</div><h1>V TRADE AI</h1><div class="muted">Secure login. Free accounts stay in Demo mode; paid package access unlocks the Main Dashboard.</div><div class="roles"><button id="userMode" class="active" type="button">👤 User</button><button id="adminMode" type="button">👑 Admin</button></div><form id="form"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="submit">🔐 Sign in as User</button></form><div id="twofa" hidden><div class="field"><label>2FA code</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><button class="btn" id="verify" type="button">Verify & Continue</button></div><div id="msg" class="msg"></div><div id="backend" class="backend">Checking Render backend…</div><div class="links"><a href="index.html">← Home</a><a href="register.html">Create account</a></div></main><script>const API=window.VTRADE?.API||'https://forexai-6xw6.onrender.com',$=id=>document.getElementById(id);let role='user',challenge='';function setRole(r){role=r;$('userMode').classList.toggle('active',r==='user');$('adminMode').classList.toggle('active',r==='admin');$('submit').textContent=r==='admin'?'👑 Sign in as Admin':'🔐 Sign in as User'}function say(t,ok=false){$('msg').textContent=t;$('msg').style.color=ok?'#22e58a':'#ff5968'}async function api(path,options={}){const c=new AbortController(),timer=setTimeout(()=>c.abort(),12000);try{const r=await fetch(API+path,{...options,mode:'cors',credentials:'include',cache:'no-store',signal:c.signal,headers:{'Content-Type':'application/json',...(options.headers||{})}});const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{d={error:text||('HTTP '+r.status)}}if(!r.ok)throw Error(d.error||('Request failed ('+r.status+')'));return d}catch(e){if(e.name==='AbortError')throw Error('Render backend timeout.');throw e}finally{clearTimeout(timer)}}function save(d){if(!d?.token)throw Error('Authentication token was not returned.');const t=String(d.token),u=d.user||{};sessionStorage.setItem('vtrade_auth_token',t);sessionStorage.setItem('vtrade_auth',t);sessionStorage.setItem('vtrade_user',JSON.stringify(u));localStorage.setItem('vtrade_auth_token',t);localStorage.setItem('vtrade_auth',t);localStorage.setItem('vtrade_user',JSON.stringify(u));location.replace('dashboard.html?flow=auth')}async function login(e){e.preventDefault();$('submit').disabled=true;say('Signing in…',true);try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});if(d.requires2FA){challenge=d.challenge;$('form').hidden=true;$('twofa').hidden=false;say('2FA code required.',true);return}const r=String(d.user?.role||d.role||'user').toLowerCase();if(role==='admin'&&!['admin','administrator'].includes(r))throw Error('This account is not an administrator.');if(role==='user'&&['admin','administrator'].includes(r))throw Error('Admin account detected. Please choose Admin.');save(d)}catch(e){say(e.message||'Login failed.')}finally{$('submit').disabled=false}}$('userMode').onclick=()=>setRole('user');$('adminMode').onclick=()=>setRole('admin');$('form').onsubmit=login;$('verify').onclick=async()=>{try{save(await api('/api/auth/2fa/verify',{method:'POST',body:JSON.stringify({challenge,code:$('code').value.trim()})}))}catch(e){say(e.message||'2FA verification failed.')}};(async()=>{try{const r=await fetch(API+'/api/auth/health',{mode:'cors',credentials:'omit',cache:'no-store'});if(!r.ok)throw Error();$('backend').textContent='● Render backend connected';$('backend').style.color='#22e58a'}catch{$('backend').textContent='● Render backend unavailable'}})()</script></body></html>
