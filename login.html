<!DOCTYPE html>
<html lang="km" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V TRADE AI - Login & 2FA Security</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // ឆែកមើលថាតើធ្លាប់ Login រួចហើយឬនៅ បើធ្លាប់ហើយ ទម្លាក់ចូល Admin Dashboard ភ្លាម
        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('vtrade_logged_user');
            if (savedUser) {
                window.location.href = 'admin-dashboard.html';
            }
        });
    </script>
</head>
<body class="bg-[#07090e] text-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-8 bg-gray-900/80 border border-gray-800 rounded-2xl shadow-2xl backdrop-blur-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-blue-500 mb-1">V TRADE AI & BOT</h1>
            <p id="authModalTitle" class="text-xs text-gray-400">Admin & 2FA Secure Authentication</p>
        </div>

        <!-- ផ្នែកដាក់ Email / Username -->
        <div id="loginFormSection" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Email Address</label>
                <input type="email" id="authEmail" value="admin@vtrade.com" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
                <input type="password" id="authPassword" value="••••••••" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="proceedTo2FAStep()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl transition text-sm">
                បន្តទៅផ្ទៀងផ្ទាត់ 2FA (Next)
            </button>
        </div>

        <!-- ផ្នែកផ្ទៀងផ្ទាត់ OTP (2FA) -->
        <div id="otpVerificationSection" class="hidden space-y-4">
            <div class="bg-amber-500/10 border border-amber-500/30 p-3 rounded-xl text-center">
                <span class="text-xs text-amber-400">OTP សម្រាប់ Development only — មិនមែន production authentication:</span>
                <div id="generatedOtpDisplay" class="text-lg font-bold text-amber-300 tracking-widest mt-1">------</div>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">បញ្ចូលលេខកូដ OTP ៦ខ្ទង់</label>
                <input type="text" id="otpInputCode" maxlength="6" placeholder="******" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-center text-lg tracking-widest text-white focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="verifyOtpAndLogin()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition text-sm">
                ផ្ទៀងផ្ទាត់ និងចូលប្រព័ន្ធ (Verify & Login)
            </button>
        </div>
    </div>

    <script>
        let activeOtpCode = null;

        function proceedTo2FAStep() {
            const email = document.getElementById('authEmail').value;
            if(!email) {
                alert('សូមបំពេញ Email ជាមុនសិន!');
                return;
            }
            // បង្កើតកូដ OTP ថ្មីចៃដន្យ
            activeOtpCode = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('generatedOtpDisplay').innerText = activeOtpCode;
            
            // ប្តូរបង្ហាញផ្ទាំង OTP
            document.getElementById('loginFormSection').classList.add('hidden');
            document.getElementById('otpVerificationSection').classList.remove('hidden');
            document.getElementById('authModalTitle').innerText = '2FA OTP Verification Required';
        }

        function verifyOtpAndLogin() {
            const userEnteredOtp = document.getElementById('otpInputCode').value.trim();
            const email = document.getElementById('authEmail').value;
            
            if(userEnteredOtp === activeOtpCode) {
                // កាត់យកឈ្មោះពី Email មករក្សាទុក
                const shortName = email ? email.split('@')[0] : 'Admin Secured';
                localStorage.setItem('vtrade_logged_user', shortName);
                
                alert('ផ្ទៀងផ្ទាត់ 2FA OTP ជោគជ័យ! កំពុងចូលទៅកាន់ Dashboard...');
                
                // បញ្ជូនទៅកាន់ Dashboard ស្វ័យប្រវត្តិ
                window.location.href = 'admin-dashboard.html';
            } else {
                alert('លេខកូដ OTP មិនត្រឹមត្រូវទេ! (កូដត្រឹមត្រូវគឺ៖ ' + activeOtpCode + ')');
            }
        }
    </script>
</body>
</html>
