<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050912">
<title>V TRADE AI — Mobile Router</title>
<style>html,body{margin:0;min-height:100%;background:#050912;color:#fff;font:14px Arial}body{display:grid;place-items:center;min-height:100dvh}.box{padding:22px 26px;border:1px solid #233552;border-radius:16px;background:#09111e;text-align:center}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22e58a;box-shadow:0 0 12px #22e58a;margin-right:7px}</style>
<script>
(function(){
  'use strict';
  const BACKEND='https://forexai-6xw6.onrender.com';
  const token=()=>sessionStorage.getItem('vtrade_auth_token')||sessionStorage.getItem('vtrade_auth')||localStorage.getItem('vtrade_auth_token')||localStorage.getItem('vtrade_auth')||'';
  const go=(file)=>{const u=new URL(file,location.href);u.searchParams.set('v','20260820-mobile-router-v2');location.replace(u.href)};
  const adminRole=r=>['admin','administrator'].includes(String(r||'').trim().toLowerCase());
  async function route(){
    const t=token();
    if(!t)return go('connection.html?required=login');
    try{
      const r=await fetch(BACKEND+'/api/auth/session',{method:'GET',mode:'cors',credentials:'omit',cache:'no-store',headers:{Accept:'application/json','x-vtrade-auth':t}});
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d.user){
        try{sessionStorage.setItem('vtrade_user',JSON.stringify(d.user));localStorage.setItem('vtrade_user',JSON.stringify(d.user))}catch(e){}
        return go(adminRole(d.user.role)?'admin-dashboard.html':'premium-dashboard-live.html');
      }
    }catch(e){}
    try{
      const raw=sessionStorage.getItem('vtrade_user')||localStorage.getItem('vtrade_user');
      const u=raw?JSON.parse(raw):null;
      if(u&&u.role)return go(adminRole(u.role)?'admin-dashboard.html':'premium-dashboard-live.html');
    }catch(e){}
    go('connection.html?required=login');
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',route,{once:true});else route();
})();
</script>
  <script src="vtrade-connection.js"></script>
  <script src="terminal-pre-market.js"></script>
  <script src="vtrade-rbac-guard.js"></script>
</head>
<body><div class="box"><span class="dot"></span>Verifying account session…</div></body>
</html>
