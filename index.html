<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>Forex AI Pro - Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        body { background-color: #0b0e14; color: white; font-family: sans-serif; }
    </style>
</head>
<body>
    <!-- Live Ticker -->
    <div class="bg-black p-2 text-xs border-b border-gray-800">
        🔴 LIVE MARKET: BTC/USD: <span id="btcPrice" class="text-green-400">Loading...</span>
    </div>

    <main class="max-w-6xl mx-auto p-4 space-y-4">
        <header class="flex justify-between items-center">
            <h1 class="text-xl font-bold">Forex AI <span class="text-blue-500">Pro</span></h1>
            <div class="space-x-2">
                <a href="admin-dashboard.html" class="bg-purple-600 px-3 py-1 rounded text-xs">Dashboard</a>
                <a href="profile.html" class="bg-blue-600 px-3 py-1 rounded text-xs">Profile</a>
            </div>
        </header>

        <!-- Chart Section -->
        <div id="chartContainer" style="height:400px; width:100%; border-radius:12px; overflow:hidden;"></div>
    </main>

    <script>
        // ១. ស្វ័យប្រវត្តិបង្ហាញ Chart
        new TradingView.widget({
            "container_id": "chartContainer",
            "symbol": "BINANCE:BTCUSDT",
            "autosize": true,
            "theme": "dark",
            "style": "1",
            "interval": "15"
        });

        // ២. Fetch តម្លៃ BTC ផ្ទាល់
        async function updatePrice() {
            try {
                let res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
                let data = await res.json();
                document.getElementById('btcPrice').innerText = '$' + data.bitcoin.usd.toLocaleString();
            } catch(e) { document.getElementById('btcPrice').innerText = 'Check Internet'; }
        }
        updatePrice();
        setInterval(updatePrice, 20000);
    </script>
</body>
</html>
