<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex AI Pro - Ultimate Responsive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="top-nav">
            <h1>Forex AI <span>Pro</span></h1>
            <div class="switcher-group">
                <button class="asset-btn active" onclick="changeAsset('BINANCE:BTCUSD', this)">BTC</button>
                <button class="asset-btn" onclick="changeAsset('FX:EURUSD', this)">EUR</button>
                <button class="asset-btn" onclick="changeAsset('FX:GBPUSD', this)">GBP</button>
                <button class="asset-btn" onclick="changeAsset('OANDA:XAUUSD', this)">GOLD</button>
            </div>
        </header>

        <div class="tradingview-widget-container">
            <div id="tradingview_widget"></div>
        </div>

        <div class="ai-signal-box">
            <div class="signal-header">
                <h2 id="ai-signal-text">STRONG BUY</h2>
                <span class="confidence" id="ai-confidence">Confidence: 99.4%</span>
            </div>
            <div class="signal-details">
                <div class="detail-item"><span class="label">Trend</span><span class="value bullish" id="ai-trend">Bullish</span></div>
                <div class="detail-item"><span class="label">Session</span><span class="value" id="active-session">Loading...</span></div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>🎯 Strategy</h3>
                <div class="row"><span>Action:</span> <span class="green">Long Position</span></div>
                <div class="row"><span>Risk/Reward:</span> <span>1:2.5</span></div>
            </div>
            <div class="card">
                <h3>📊 Confluence</h3>
                <div class="row"><span>RSI (14):</span> <span>58.2</span></div>
                <div class="row"><span>MACD:</span> <span class="green">Bullish</span></div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="script.logics.js"></script>
</body>
</html>
