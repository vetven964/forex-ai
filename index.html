<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex AI Pro - Advanced Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Battambang', sans-serif; background-color: #0b0e14; color: #e4e4e7; }
        .glass { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        /* ការពារបាត់បង់ Dashboard */
        #chartContainer { min-height: 400px; display: block !important; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
    </style>
</head>
<body class="p-4">

    <!-- Live Market Ticker -->
    <div class="bg-gray-950 p-3 rounded-xl border border-gray-800 mb-6 flex space-x-6 text-sm">
        <span class="text-gray-400">🔴 LIVE:</span>
        <span id="tickerBtc" class="text-green-400 font-bold">BTC/USD: $65,000</span>
        <span id="tickerEth" class="text-green-400 font-bold">ETH/USD: $3,500</span>
    </div>

    <!-- Header -->
    <div class="glass p-6 rounded-2xl mb-6 flex justify-between items-center">
        <h1 class="text-2xl font-black text-white">Forex AI <span class="text-blue-500">Dashboard</span></h1>
        <div class="space-x-2">
            <button onclick="changeSymbol('BINANCE:BTCUSDT')" class="bg-blue-600 px-4 py-2 rounded-lg text-xs">BTC</button>
            <button onclick="changeSymbol('BINANCE:ETHUSDT')" class="bg-gray-700 px-4 py-2 rounded-lg text-xs">ETH</button>
        </div>
    </div>

    <!-- Dashboard Content -->
    <div class="dashboard-grid mb-6">
        <!-- AI Card -->
        <div class="glass p-6 rounded-2xl border-l-4 border-green-500">
            <h2 class="text-green-400 font-bold text-xl">STRONG BUY</h2>
            <p class="text-xs text-gray-400 mt-2">Confidence: 95.8% | Bullish</p>
        </div>
        <!-- Terminal Hub -->
        <div class="glass p-6 rounded-2xl">
            <h3 class="text-white font-bold mb-2">🤖 AI Terminal</h3>
            <div id="terminalLogs" class="bg-black p-3 h-24 overflow-y-auto text-xs text-green-400 mb-2 border border-gray-800"></div>
            <input type="text" id="terminalInput" class="w-full bg-gray-900 border border-gray-700 p-2 rounded text-xs" placeholder="Command...">
        </div>
    </div>

    <!-- Chart -->
    <div class="glass p-4 rounded-2xl h-[500px]">
        <div id="chartContainer" style="width:100%; height:100%;"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="script-logics.js"></script>
</body>
</html>
