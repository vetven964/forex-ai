<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex AI Pro - Advanced Trading Suite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Battambang', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Bar -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex flex-wrap justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <h1 class="text-xl font-bold text-white">Forex AI <span class="text-blue-500">Pro</span></h1>
        </div>
        
        <!-- Asset Switcher Buttons -->
        <div class="flex items-center space-x-2 my-2 sm:my-0">
            <button class="bg-blue-600 text-white px-3.5 py-1.5 rounded-lg text-sm font-medium hover:bg-blue-700 transition">BTC/USD</button>
            <button class="bg-gray-700 text-gray-300 px-3.5 py-1.5 rounded-lg text-sm font-medium hover:bg-gray-600 transition">EUR/USD</button>
            <button class="bg-gray-700 text-gray-300 px-3.5 py-1.5 rounded-lg text-sm font-medium hover:bg-gray-600 transition">GBP/USD</button>
            <button class="bg-gray-700 text-gray-300 px-3.5 py-1.5 rounded-lg text-sm font-medium hover:bg-gray-600 transition">XAU/USD</button>
        </div>

        <!-- Link to Profile Page -->
        <div>
            <a href="profile.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-blue-600/30">
                Profile របស់ខ្ញុំ
            </a>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- AI Signal Dashboard Card -->
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="text-xs text-gray-400 uppercase tracking-wider">AI Signal Recommendation</span>
                <h2 class="text-3xl font-extrabold text-green-400 mt-1">STRONG BUY</h2>
            </div>
            <div class="flex flex-wrap gap-6 text-center md:text-right">
                <div>
                    <p class="text-xs text-gray-400">AI Confidence</p>
                    <p class="text-lg font-bold text-blue-400">95.8%</p>
                </div>
                <div>
                    <p class="text-xs text-gray-400">AI Trend Status</p>
                    <p class="text-lg font-bold text-green-400">Bullish</p>
                </div>
                <div>
                    <p class="text-xs text-gray-400">Data Feed</p>
                    <p class="text-lg font-bold text-gray-200">TradingView Live</p>
                </div>
            </div>
        </div>

        <!-- TradingView Chart Container -->
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-4 shadow-xl min-h-[500px]">
            <div id="tradingview_widget" class="w-full h-full min-h-[480px] flex items-center justify-center text-gray-500">
                <!-- TradingView Widget Widget Here -->
                <span>TradingView Chart Display</span>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-gray-500 text-xs border-t border-gray-800">
        &copy; 2026 Forex AI. All rights reserved.
    </footer>

</body>
</html>
