<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>VET Trade AI & Pro Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        body { background-color: #0b0e14; color: white; font-family: sans-serif; }
    </style>
</head>
<body class="p-4 space-y-6 max-w-6xl mx-auto">

    <!-- Header & Live Ticker -->
    <header class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h1 class="text-xl font-bold flex items-center gap-2">
            🤖 <span class="text-blue-500">VET Trade AI</span> Terminal
        </h1>
        <div class="text-xs bg-black px-3 py-1.5 rounded border border-gray-800">
            🔴 LIVE BTC/USD: <span id="btcPrice" class="text-green-400 font-bold">$65,230.00</span>
        </div>
    </header>

    <!-- 1. TradingView Chart Section -->
    <section class="bg-gray-900 p-3 rounded-xl border border-gray-800 shadow-lg">
        <div class="text-xs text-gray-400 mb-2 font-semibold">📈 Live Market Chart</div>
        <div id="chartContainer" style="height: 400px; width: 100%; border-radius: 8px; overflow: hidden;"></div>
    </section>

    <!-- 2. VET Trade AI Chat Box Section -->
    <section class="bg-gray-900 p-4 rounded-xl border border-gray-800 shadow-lg space-y-3">
        <div class="flex justify-between items-center">
            <span class="text-sm font-bold text-gray-300">💬 AI Assistant Panel</span>
            <select class="bg-gray-800 text-xs text-white px-2 py-1 rounded border border-gray-700">
                <option>BTCUSDT (Bitcoin)</option>
                <option>ETHUSDT (Ethereum)</option>
            </select>
        </div>

        <!-- Chat History Box -->
        <div id="chatLogs" class="bg-black h-48 rounded p-3 overflow-y-auto text-xs text-gray-300 space-y-2 border border-gray-800">
            <div><span class="text-blue-400 font-bold">VET Bot:</span> សួស្តី! ខ្ញុំរួចជាស្រេចក្នុងការជួយវិភាគទីផ្សារជូនបងប្រុស។ សូមជ្រើសរើសបញ្ជាខាងក្រោម ឬវាយសួរបាន!</div>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-2">
            <button onclick="sendAction('Analyze Chart')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded transition">Analyze Chart</button>
            <button onclick="sendAction('Best Setup')" class="bg-gray-800 hover:bg-gray-700 text-white text-xs px-3 py-1.5 rounded transition">Best Setup</button>
            <button onclick="sendAction('Outlook')" class="bg-gray-800 hover:bg-gray-700 text-white text-xs px-3 py-1.5 rounded transition">Outlook</button>
        </div>

        <!-- Input Box -->
        <div class="flex gap-2 mt-2">
            <input type="text" id="userInput" placeholder="វាយសំណួរ ឬទីផ្សារ..." class="flex-1 bg-black text-xs text-white px-3 py-2 rounded border border-gray-800 focus:outline-none focus:border-blue-500">
            <button onclick="sendCustomMessage()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-xs transition">➤</button>
        </div>
    </section>

    <script>
        // Load TradingView Chart
        setTimeout(() => {
            new TradingView.widget({
                "container_id": "chartContainer",
                "symbol": "BINANCE:BTCUSDT",
                "autosize": true,
                "theme": "dark",
                "style": "1",
                "interval": "15",
                "timezone": "Etc/UTC"
            });
        }, 300);

        // Simulated Live Price Update
        setInterval(() => {
            let base = 65000;
            let random = Math.floor(Math.random() * 400);
            document.getElementById('btcPrice').innerText = '$' + (base + random).toLocaleString() + '.00';
        }, 3000);

        // Chat Interaction Logic
        function sendAction(actionType) {
            const logs = document.getElementById('chatLogs');
            logs.innerHTML += `<div><span class="text-purple-400 font-bold">You:</span> ${actionType}</div>`;
            
            setTimeout(() => {
                logs.innerHTML += `<div><span class="text-blue-400 font-bold">VET Bot:</span> Analyzing ${actionType} for BTC/USDT... Market trend looks stable with bullish confirmation zones. Good to go!</div>`;
                logs.scrollTop = logs.scrollHeight;
            }, 500);
            logs.scrollTop = logs.scrollHeight;
        }

        function sendCustomMessage() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if(!val) return;

            const logs = document.getElementById('chatLogs');
            logs.innerHTML += `<div><span class="text-purple-400 font-bold">You:</span> ${val}</div>`;
            input.value = '';

            setTimeout(() => {
                logs.innerHTML += `<div><span class="text-blue-400 font-bold">VET Bot:</span> Received query regarding "${val}". AI Engine suggests monitoring key support levels.</div>`;
                logs.scrollTop = logs.scrollHeight;
            }, 600);
            logs.scrollTop = logs.scrollHeight;
        }
    </script>
</body>
</html>
