<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex AI Pro - Financial Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Battambang', sans-serif; }</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex flex-wrap justify-between items-center shadow-md">
        <h1 class="text-xl font-bold text-white">Forex AI <span class="text-blue-500">Pro</span></h1>
        <div class="flex space-x-2">
            <button onclick="changeSymbol('BINANCE:BTCUSDT', this)" class="asset-btn bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm">BTC</button>
            <button onclick="changeSymbol('FX:EURUSD', this)" class="asset-btn bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg text-sm">EUR</button>
            <button onclick="changeSymbol('OANDA:XAUUSD', this)" class="asset-btn bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg text-sm">GOLD</button>
        </div>
        <a href="#" class="bg-sky-600 px-4 py-2 rounded-xl text-sm font-medium">📤 Telegram Signal</a>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
        
        <!-- Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- TradingView Chart -->
            <div class="lg:col-span-2 bg-gray-800 border border-gray-700 rounded-2xl p-2 h-[500px]">
                <div id="chartContainer" style="height:100%; width:100%;"></div>
            </div>

            <!-- Economic Calendar Widget -->
            <div class="bg-gray-800 border border-gray-700 rounded-2xl p-4 shadow-xl">
                <h3 class="text-sm font-bold text-white mb-4 uppercase">📅 Live Economic Calendar</h3>
                <!-- TradingView Economic Calendar Widget -->
                <div class="tradingview-widget-container">
                    <div id="tradingview_economic_calendar" style="height:440px;"></div>
                </div>
            </div>
        </div>

        <!-- Signal History -->
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6">
            <h3 class="text-base font-bold text-white mb-4">📊 AI Signal Performance</h3>
            <table class="w-full text-left text-sm text-gray-300">
                <thead class="bg-gray-900 text-gray-400 border-b border-gray-700 uppercase text-xs">
                    <tr><th class="p-3">Time</th><th class="p-3">Pair</th><th class="p-3">Signal</th><th class="p-3">Status</th></tr>
                </thead>
                <tbody class="divide-y divide-gray-700 text-xs">
                    <tr><td class="p-3">12:30</td><td class="p-3">BTC/USD</td><td class="p-3 text-green-400">STRONG BUY</td><td class="p-3 text-green-400">TP HIT (+120pips)</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // Chart Function
        function changeSymbol(symbol, btn) {
            document.getElementById('chartContainer').innerHTML = '<div id="tradingview_chart" style="height:100%;width:100%"></div>';
            new TradingView.widget({
                "autosize": true, "symbol": symbol, "theme": "dark", "container_id": "tradingview_chart"
            });
        }
        
        // Economic Calendar Widget Script
        new TradingView.widget({
            "container_id": "tradingview_economic_calendar",
            "width": "100%",
            "height": "100%",
            "locale": "en",
            "importanceFilter": "-1,0,1",
            "currencyFilter": "USD,EUR,GBP,JPY",
            "calendarOnly": true,
            "theme": "dark"
        });

        changeSymbol('BINANCE:BTCUSDT');
    </script>
</body>
</html>
