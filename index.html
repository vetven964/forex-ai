<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex AI Pro - Professional Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Battambang', sans-serif; }</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- Live Ticker -->
    <div class="bg-gray-950 text-xs py-1.5 px-6 border-b border-gray-800 flex overflow-x-auto space-x-6 text-gray-400 whitespace-nowrap">
        <span>🔴 LIVE MARKET:</span>
        <span>BTC/USD: <strong class="text-green-400">$65,017</strong></span>
        <span>EUR/USD: <strong class="text-red-400">1.0850</strong></span>
        <span>XAU/USD: <strong class="text-green-400">$2,340</strong></span>
    </div>

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex flex-wrap justify-between items-center">
        <h1 class="text-xl font-bold text-white">Forex AI <span class="text-blue-500">Pro</span></h1>
        
        <!-- Asset Switcher -->
        <div class="flex space-x-2">
            <button onclick="changeSymbol('BINANCE:BTCUSDT')" class="bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded-lg text-sm">BTC</button>
            <button onclick="changeSymbol('FX:EURUSD')" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm">EUR</button>
            <button onclick="changeSymbol('FX:GBPUSD')" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm">GBP</button>
            <button onclick="changeSymbol('OANDA:XAUUSD')" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm">GOLD</button>
        </div>

        <a href="profile.html" class="bg-blue-600 px-4 py-2 rounded-xl text-sm font-medium">Profile របស់ខ្ញុំ</a>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
        <!-- Signal Card -->
        <div class="bg-gray-800 rounded-2xl p-6 border border-gray-700 flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-400 uppercase">AI Signal</p>
                <h2 id="signalLabel" class="text-3xl font-extrabold text-green-400">STRONG BUY</h2>
            </div>
            <button onclick="sendToTelegram()" class="bg-sky-600 px-4 py-2 rounded-xl text-sm">📤 ផ្ញើទៅ Telegram</button>
        </div>

        <!-- Chart Container -->
        <div id="chartContainer" class="bg-gray-800 rounded-2xl p-2 h-[500px] border border-gray-700">
            <!-- Chart will be injected here -->
        </div>
    </main>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        function changeSymbol(symbol) {
            document.getElementById('chartContainer').innerHTML = '<div id="tradingview_chart" style="height:100%"></div>';
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "15",
                "theme": "dark",
                "style": "1",
                "container_id": "tradingview_chart"
            });
        }
        
        // Load default chart
        changeSymbol('BINANCE:BTCUSDT');

        function sendToTelegram() {
            window.open(`https://t.me/share/url?url=&text=🚨 AI SIGNAL: STRONG BUY on ${document.title}`, '_blank');
        }
    </script>
</body>
</html>
