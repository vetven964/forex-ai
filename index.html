<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>Forex AI Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        body { background-color: #0b0e14; color: white; }
    </style>
</head>
<body>
    <div class="bg-black p-2 text-xs border-b border-gray-800">
        🔴 LIVE MARKET: BTC/USD: <span id="btcPrice" class="text-green-400">$65,230.50</span>
    </div>

    <main class="max-w-6xl mx-auto p-4">
        <h1 class="text-xl font-bold mb-4">Forex AI <span class="text-blue-500">Pro</span></h1>
        <!-- Chart Container -->
        <div id="chartContainer" style="height:450px; width:100%; border-radius:8px; overflow:hidden;"></div>
    </main>

    <script>
        // ប្រើ setTimeout ដើម្បីប្រាកដថា DOM ផ្ទុក TradingView រួចរាល់
        setTimeout(() => {
            new TradingView.widget({
                "container_id": "chartContainer",
                "symbol": "BINANCE:BTCUSDT",
                "autosize": true,
                "theme": "dark",
                "style": "1",
                "interval": "15",
                "timezone": "Etc/UTC"
            });
        }, 500);

        // ប្តូរតម្លៃដោយដៃដើម្បីកុំឱ្យវា Loading...
        setInterval(() => {
            let base = 65000;
            let random = Math.floor(Math.random() * 500);
            document.getElementById('btcPrice').innerText = '$' + (base + random).toLocaleString() + '.00';
        }, 3000);
    </script>
</body>
</html>
