<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex AI Pro - Advanced Trading Suite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation Bar -->
        <header class="top-nav">
            <div class="brand">
                <h1>Forex AI <span>Pro</span></h1>
            </div>
            
            <div class="controls-group">
                <div class="switcher-group">
                    <button class="asset-btn active" onclick="changeAsset('BINANCE:BTCUSD', 'Bitcoin')">BTC/USD</button>
                    <button class="asset-btn" onclick="changeAsset('FX:EURUSD', 'EUR/USD')">EUR/USD</button>
                    <button class="asset-btn" onclick="changeAsset('FX:GBPUSD', 'GBP/USD')">GBP/USD</button>
                    <button class="asset-btn" onclick="changeAsset('OANDA:XAUUSD', 'Gold')">XAU/USD</button>
                </div>
            </div>

            <!-- ប៊ូតុងចូលទៅកាន់ Profile -->
            <div style="margin-left: 20px;">
                <a href="profile.html" style="background-color: #2563eb; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; font-family: sans-serif;">Profile របស់ខ្ញុំ</a>
            </div>
        </header>

        <!-- TradingView Advanced Widget Container (Clean & Large) -->
        <div class="tradingview-widget-container">
            <div id="tradingview_widget"></div>
        </div>

        <!-- AI Signal Dashboard -->
        <div class="ai-signal-box">
            <div class="signal-header">
                <h2 id="ai-signal-text">STRONG BUY</h2>
                <span class="confidence" id="ai-confidence">AI Confidence: 95.8%</span>
            </div>
            <div class="signal-details">
                <div class="detail-item">
                    <span class="label">AI Trend Status</span>
                    <span class="value bullish" id="ai-trend">Bullish</span>
                </div>
                <div class="detail-item">
                    <span class="label">Data Feed</span>
                    <span class="value" id="data-feed">TradingView Live</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
