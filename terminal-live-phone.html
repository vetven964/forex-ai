<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050912">
<title>V TRADE AI — Phone Terminal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070d}#phoneFrame{display:block;width:100%;height:100%;border:0;background:#04070d}
</style>
</head>
<body>
<iframe id="phoneFrame" src="premium-dashboard-live.html?phone=1&mobile-shell=v8" title="V TRADE AI Phone Terminal"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('phoneFrame');
function install(){
 const d=frame.contentDocument;
 if(!d||!d.head||!d.body)return;
 // Load the phone-only patch INSIDE the PC document. This keeps the PC file unchanged
 // while applying phone behavior to the embedded copy only.
 if(!d.getElementById('vtrade-phone-fix-v3-script')){
   const s=d.createElement('script');
   s.id='vtrade-phone-fix-v3-script';
   s.src='vtrade-mobile-fix-v3.js?v=8';
   d.head.appendChild(s);
 }
 if(!d.getElementById('vtrade-phone-v8')){
   const s=d.createElement('style');
   s.id='vtrade-phone-v8';
   s.textContent=`
@media(max-width:900px){
 html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
 #profileAdminLink{display:none!important;visibility:hidden!important;pointer-events:none!important}
 .top .vtrade-phone-profile,.top .profile,.top [id*="profile" i],.top [class*="profile" i]{display:none!important;visibility:hidden!important;pointer-events:none!important}
 .side{z-index:2000!important}
 .scrim{z-index:1900!important}
 #vtradeMobileBar{z-index:2100!important}
}
`;
   d.head.appendChild(s);
 }
 // Hard-hide the old account control by its known ID after auth/RBAC scripts run.
 const hide=()=>{
   const el=d.getElementById('profileAdminLink');
   if(el){el.style.setProperty('display','none','important');el.style.setProperty('visibility','hidden','important');el.setAttribute('aria-hidden','true');}
 };
 hide();
 setTimeout(hide,500);setTimeout(hide,1500);setTimeout(hide,3000);
}
frame.addEventListener('load',()=>setTimeout(install,100));
})();
</script>
</body>
</html>
