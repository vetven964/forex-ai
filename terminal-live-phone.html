<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050912">
<title>V TRADE AI — Phone Terminal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070d}#phoneFrame{display:block;width:100%;height:100%;border:0;background:#04070d}
</style>
</head>
<body>
<iframe id="phoneFrame" src="premium-dashboard-live.html?phone=1" title="V TRADE AI Phone Terminal"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('phoneFrame');
function install(){
  const d=frame.contentDocument;
  if(!d||!d.head||!d.body)return;
  if(d.getElementById('vtrade-phone-isolated-shell'))return;
  const s=d.createElement('style');s.id='vtrade-phone-isolated-shell';
  s.textContent=`
@media(max-width:900px){
 html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
 body{padding-bottom:0!important}
 .app{display:block!important;width:100%!important;min-width:0!important}
 .main{width:100%!important;min-width:0!important;overflow:hidden!important}
 .top{position:relative!important;display:grid!important;grid-template-columns:48px minmax(0,1fr) auto!important;grid-template-areas:"menu pair price" "menu pair status" "tfs tfs tfs"!important;gap:6px!important;min-height:142px!important;height:auto!important;padding:14px 10px 10px!important;overflow:hidden!important;z-index:80!important}
 .top>.mobile{grid-area:menu!important;display:grid!important;place-items:center!important;width:48px!important;height:48px!important;z-index:5000!important;position:relative!important}
 .top>.pair{grid-area:pair!important;min-width:0!important;overflow:hidden!important}
 .top>.price{grid-area:price!important;font-size:27px!important;line-height:1!important;white-space:nowrap!important}
 .top>.live,.top>.backend{grid-area:status!important;justify-self:end!important;white-space:nowrap!important}
 .top>.tfs{grid-area:tfs!important;margin:3px 0 0!important;display:flex!important;gap:8px!important;overflow-x:auto!important;scrollbar-width:none!important}
 .top>.tfs::-webkit-scrollbar{display:none}.top>.tfs button{flex:0 0 72px!important;min-width:72px!important;height:46px!important}
 /* PHONE: account card is never allowed in the header. */
 #profileAdminLink,#vtradeAccountMenu,#vtradeProfileLink,#vtradeAdminLink,#vtradeUserLink,[id*="AccountMenu"],[id*="accountMenu"],[class*="account-menu"],[class*="accountMenu"],[class*="profile-menu"],[class*="profileMenu"]{display:none!important!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}
 .side{position:fixed!important;left:0!important;top:0!important;bottom:0!important;width:min(300px,84vw)!important;height:100dvh!important;z-index:99999!important;transform:translateX(-110%)!important;overflow-y:auto!important;padding:18px 13px calc(24px + env(safe-area-inset-bottom))!important}
 .side.open,.side.vtrade-open{transform:translateX(0)!important}
 .scrim{z-index:99990!important}
 .wrap{width:100%!important;max-width:none!important;padding:12px 10px 105px!important;overflow:hidden!important}
 .card,.chart{min-width:0!important;max-width:100%!important;overflow:hidden!important}
 .toolbar,.cards,.radar,.gategrid,.mainrow,.news-top,.news-grid{min-width:0!important}
 #vtradeMobileBar{left:8px!important;right:8px!important;bottom:8px!important;z-index:9000!important;grid-template-columns:repeat(5,minmax(0,1fr))!important}
 body.vtrade-phone-menu-open #vtradeMobileBar,body:has(.side.open) #vtradeMobileBar,body:has(.side.vtrade-open) #vtradeMobileBar{display:none!important}
}
@media(min-width:901px){html,body{overflow:hidden!important}}
`;
  d.head.appendChild(s);
  const hide=()=>{
    d.querySelectorAll('body *').forEach(el=>{
      if(el.closest('.side'))return;
      const id=String(el.id||'').toLowerCase(),cls=String(el.className||'').toLowerCase();
      if(/accountmenu|account-menu|profilemenu|profile-menu/.test(id+' '+cls))el.style.setProperty('display','none','important');
      const t=(el.textContent||'').trim();
      if(t.length<=80&&/vet ven/i.test(t)&&/administrator/i.test(t)){
        const r=el.getBoundingClientRect();if(r.width>140&&r.height>45&&r.top<d.defaultView.innerHeight*.7)el.style.setProperty('display','none','important');
      }
    });
  };
  hide();
  new MutationObserver(hide).observe(d.body,{childList:true,subtree:true});
  const sync=()=>{const open=!!d.querySelector('.side.open,.side.vtrade-open');d.body.classList.toggle('vtrade-phone-menu-open',open)};
  new MutationObserver(sync).observe(d.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  sync();
}
frame.addEventListener('load',()=>setTimeout(install,80));
})();
</script>
</body>
</html>
