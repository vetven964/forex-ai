<title>V TRADE AI — Phone Terminal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070d}#phoneFrame{display:block;width:100%;height:100%;border:0;background:#04070d}
</style>

<body>
<iframe id="phoneFrame" src="premium-dashboard-live.html?phone=1&mobile-shell=v15&header-fix=20260822-final" title="V TRADE AI Phone Terminal"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('phoneFrame');
function install(){
 const d=frame.contentDocument;
 if(!d||!d.head||!d.body)return;
 const add=(id,src)=>{if(!d.getElementById(id)){const s=d.createElement('script');s.id=id;s.src=src;d.head.appendChild(s)}};
 add('vtrade-phone-fix-v9-script','vtrade-mobile-fix-v4.js?v=15');
 add('vtrade-phone-nav-auth-fix-script','vtrade-phone-nav-auth-fix.js?v=2');
 add('vtrade-phone-final-v9-script','vtrade-mobile-final-fix.js?v=1');
}
frame.addEventListener('load',()=>setTimeout(install,100));
})();
</script>
</body>
</html>
