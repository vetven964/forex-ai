<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050912">
<title>V TRADE AI — Phone Terminal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070d}#phoneFrame{display:block;width:100%;height:100%;border:0;background:#04070d}
</style>
</head>
<body>
<iframe id="phoneFrame" src="premium-dashboard-live.html?phone=1&mobile-shell=v12&header-fix=20260822" title="V TRADE AI Phone Terminal"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('phoneFrame');
function install(){
 const d=frame.contentDocument;
 if(!d||!d.head||!d.body)return;
 if(!d.getElementById('vtrade-phone-fix-v7-script')){
   const s=d.createElement('script');
   s.id='vtrade-phone-fix-v7-script';
   s.src='vtrade-mobile-fix-v4.js?v=12';
   d.head.appendChild(s);
 }
}
frame.addEventListener('load',()=>setTimeout(install,100));
})();
</script>
</body>
</html>
