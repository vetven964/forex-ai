<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050912">
<title>V TRADE AI — Phone Terminal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070d}#phoneFrame{display:block;width:100%;height:100%;border:0;background:#04070d}
</style>
</head>
<body>
<iframe id="phoneFrame" src="premium-dashboard-live.html?phone=1&mobile-shell=v10&header-fix=20260822" title="V TRADE AI Phone Terminal"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('phoneFrame');
function hidePhoneHeaderAccount(d){
  if(!d||!d.body)return;
  const top=d.querySelector('.top');
  if(!top)return;
  const known=d.getElementById('profileAdminLink');
  if(known) known.style.setProperty('display','none','important');
  const candidates=top.querySelectorAll('button,a,[role="button"],div,section');
  for(const el of candidates){
    const text=(el.textContent||'').replace(/\s+/g,' ').trim();
    if(text.length>0&&text.length<100&&/VET\s+VEN/i.test(text)&&/Administrator/i.test(text)){
      el.style.setProperty('display','none','important');
      el.style.setProperty('visibility','hidden','important');
      el.style.setProperty('pointer-events','none','important');
      el.setAttribute('aria-hidden','true');
    }
  }
}
function install(){
 const d=frame.contentDocument;
 if(!d||!d.head||!d.body)return;
 if(!d.getElementById('vtrade-phone-fix-v4-script')){
   const s=d.createElement('script');
   s.id='vtrade-phone-fix-v4-script';
   s.src='vtrade-mobile-fix-v4.js?v=10';
   d.head.appendChild(s);
 }
 if(!d.getElementById('vtrade-phone-v10')){
   const s=d.createElement('style');
   s.id='vtrade-phone-v10';
   s.textContent=`
@media(max-width:900px){
 html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
 .top #profileAdminLink,.top .vtrade-phone-profile,.top .profile,.top [id*="profile" i],.top [class*="profile" i]{display:none!important;visibility:hidden!important;pointer-events:none!important}
 .side{top:183px!important;z-index:1200!important;transform:none!important}
 #vtradeMobileBar{z-index:5000!important;display:grid!important}
}
`;
   d.head.appendChild(s);
 }
 const run=()=>hidePhoneHeaderAccount(d);
 run();
 new MutationObserver(run).observe(d.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','id']});
 [300,800,1500,3000,6000].forEach(ms=>setTimeout(run,ms));
}
frame.addEventListener('load',()=>setTimeout(install,100));
})();
</script>
</body>
</html>
