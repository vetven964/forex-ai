<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V TRADE AI Mini App v5.3.2 — XAUUSD</title>
    <!-- ដាក់បញ្ចូល Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-buy { background-color: #22c55e; color: white; }
        .btn-sell { background-color: #ef4444; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2>V TRADE AI v5.3.2 — XAUUSD</h2>
        <div class="card">
            <p><strong>សមតុល្យគណនី (Balance):</strong> <span id="user-balance">Loading...</span></p>
            <p><strong>ទីផ្សារបច្ចុប្បន្ន (Asset):</strong> XAUUSD · VT Markets MT5</p>
        </div>
        
        <div class="card">
            <h3>សញ្ញា XAUUSD</h3>
            <p id="signal-status">កំពុងពិនិត្យ MTF ICT + VT Markets MT5…</p>
            <button class="btn btn-buy" onclick="loadSignal()">🔄 Refresh Analysis</button>
        </div>
    </div>

    <script>
        // เริ่มต้นใช้งาน Telegram WebApp API
        let tg = window.Telegram.WebApp;
        tg.expand(); // ពង្រីកផ្ទាំង Mini App ឱ្យពេញអេក្រង់ទូរស័ព្ទ

        // បង្ហាញឈ្មោះអ្នកប្រើប្រាស់ Telegram
        document.getElementById('user-balance').innerText = "$5,420.00 USDT";

        async function loadSignal() {
            const el = document.getElementById('signal-status');
            try {
                const r = await fetch('https://forexai-6xw6.onrender.com/api/analysis/xauusd', {cache:'no-store'});
                const a = await r.json();
                if (!r.ok || !a.success) throw new Error(a.error || 'Analysis unavailable');
                el.innerText = `${a.signal || 'WAIT'} · ${a.status || '—'} · Score ${a.confidence ?? '—'}/100 · Entry ${a.entry ?? 'WAIT'}`;
            } catch (e) {
                el.innerText = `WAIT · ${e.message || 'VT Markets MT5 unavailable'}`;
            }
        }
    </script>
</body>
</html>
